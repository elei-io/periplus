<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{title}</title>
  <script type="application/ld+json">{product_json}</script>
</head>
<body>
  <header><a href="/">Store home</a></header>
  <main>
    <article data-sku="{sku}">
      <h1>{title}</h1>
      <p class="price">{currency} {price}</p>
      <p class="availability">{availability_label}</p>
      {filler}
    </article>
  </main>
  <footer>Independent synthetic retailer {retailer_number}</footer>
</body>
</html>
