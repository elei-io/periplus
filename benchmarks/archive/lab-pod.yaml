# Temporary diagnostic only; never part of the homelab Flux deployment.
apiVersion: v1
kind: Pod
metadata:
  name: periplus-archive-benchmark
  namespace: applications
  labels:
    diagnostic: periplus-archive-benchmark
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 21600
  automountServiceAccountToken: false
  containers:
    - name: benchmark
      image: ghcr.io/elei-io/periplus-core:sha-5e7c572@sha256:cde9020b8a551fb5180c4eb8009f1a00d76297c542f5b5e3b5e52031d1a1b129
      command: [python, -c, "import time; time.sleep(21600)"]
      envFrom:
        - secretRef:
            name: s3-periplus
      env:
        - name: PYTHONPATH
          value: /work/src:/work/deps
      resources:
        requests: {cpu: '2', memory: 2Gi, ephemeral-storage: 15Gi}
        limits: {cpu: '4', memory: 6Gi, ephemeral-storage: 30Gi}
      volumeMounts:
        - {name: work, mountPath: /work}
  volumes:
    - name: work
      emptyDir: {sizeLimit: 25Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: periplus-archive-benchmark
  namespace: applications
spec:
  podSelector:
    matchLabels:
      diagnostic: periplus-archive-benchmark
  policyTypes: [Ingress]
  ingress: []
