map $http_origin $request_origin_host {
    default "invalid";
    "" "";
    ~^https?://([^/]+)$ $1;
}
map $http_origin $origin_present {
    default "1";
    "" "0";
}

upstream periplus_api {
    zone periplus_api 64k;
    # Kubernetes Services keep a stable virtual IP for the lifetime of the
    # Service, so resolving once at nginx startup is sufficient and avoids a
    # Docker-specific DNS resolver address in the production image.
    server ${PERIPLUS_API_HOST}:${PERIPLUS_API_PORT};
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    set $origin_mismatch "0";
    if ($request_origin_host != $http_host) {
        set $origin_mismatch $origin_present;
    }
    if ($origin_mismatch = "1") {
        return 403;
    }

    auth_basic "Periplus Admin";
    auth_basic_user_file /etc/nginx/admin.htpasswd;

    location = /healthz {
        auth_basic off;
        return 200 "ok";
    }

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/javascript application/wasm text/css;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://periplus_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${PERIPLUS_ADMIN_API_TOKEN}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
