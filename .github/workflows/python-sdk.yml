name: Python SDK

on:
  pull_request:
    paths:
      - ".github/workflows/python-sdk-release.yml"
      - ".github/workflows/python-sdk.yml"
      - "packages/periplus-python-sdk/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-sdk-release.yml"
      - ".github/workflows/python-sdk.yml"
      - "packages/periplus-python-sdk/**"
  workflow_dispatch:

concurrency:
  group: python-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/periplus-python-sdk/pyproject.toml

      - name: Install SDK
        run: python -m pip install "./packages/periplus-python-sdk[notebook]"

      - name: Run unit tests against installed SDK
        run: >-
          python -m unittest discover
          -s packages/periplus-python-sdk/tests

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/periplus-python-sdk/pyproject.toml

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: >-
          python -m build
          --outdir dist
          packages/periplus-python-sdk

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Check wheel namespace
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              roots = {name.partition("/")[0] for name in archive.namelist()}
          if "periplus_sdk" not in roots:
              raise SystemExit("wheel does not contain periplus_sdk")
          if "periplus" in roots:
              raise SystemExit("wheel unexpectedly contains the backend periplus package")

      - name: Verify clean wheel installation
        run: |
          python -m venv "${RUNNER_TEMP}/periplus-sdk-verify"
          "${RUNNER_TEMP}/periplus-sdk-verify/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/periplus-sdk-verify/bin/python" -c \
            "import periplus_sdk; assert periplus_sdk.__file__ is not None"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: periplus-python-sdk
          path: dist/
          if-no-files-found: error
          retention-days: 7
