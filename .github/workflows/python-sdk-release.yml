name: Release Python SDK

on:
  push:
    tags:
      - "periplus-python-sdk-v*"

concurrency:
  group: python-sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test release (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/periplus-python-sdk/pyproject.toml

      - name: Install SDK
        run: python -m pip install ./packages/periplus-python-sdk

      - name: Run unit tests against installed SDK
        run: >-
          python -m unittest discover
          -s packages/periplus-python-sdk/tests

  build:
    name: Build and verify release
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/periplus-python-sdk/pyproject.toml

      - name: Match tag to package version
        shell: python
        run: |
          import os
          from pathlib import Path
          import tomllib

          metadata = tomllib.loads(
              Path("packages/periplus-python-sdk/pyproject.toml").read_text()
          )
          version = metadata["project"]["version"]
          expected_tag = f"periplus-python-sdk-v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match {expected_tag!r}"
              )

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: >-
          python -m build
          --outdir dist
          packages/periplus-python-sdk

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Check wheel namespace
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          archives = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(archives) != 1:
              raise SystemExit(
                  "release must contain exactly one wheel and one source distribution"
              )
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              roots = {name.partition("/")[0] for name in names}
              if any(name.startswith("periplus_sdk/conn/") or name in {
                  "periplus_sdk/collections.py", "periplus_sdk/frontier.py",
                  "periplus_sdk/_config.py", "periplus_sdk/_http.py",
              } for name in names):
                  raise SystemExit("wheel contains removed direct-lake or control SDK modules")
          if "periplus_sdk" not in roots:
              raise SystemExit("wheel does not contain periplus_sdk")
          if "periplus" in roots:
              raise SystemExit("wheel unexpectedly contains the backend periplus package")

      - name: Verify clean wheel installation
        run: |
          python -m venv "${RUNNER_TEMP}/periplus-sdk-verify"
          "${RUNNER_TEMP}/periplus-sdk-verify/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/periplus-sdk-verify/bin/python" -c \
            "import periplus_sdk; assert periplus_sdk.__file__ is not None"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: periplus-python-sdk-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/periplus-python-sdk
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: periplus-python-sdk-${{ github.ref_name }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
