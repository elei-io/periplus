name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    env:
      # Unit-test imports construct the lazy SQLAlchemy session factory but do
      # not connect. Keep this URL isolated from any real database.
      PERIPLUS_CONTROL_DATABASE_URL: postgresql://periplus:periplus@127.0.0.1:55432/periplus_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/periplus/uv.lock
      - name: Install Python 3.14.7
        run: uv python install 3.14.7
      - name: Install backend
        run: sudo sh docker/periplus/install-icu.sh
      - name: Sync backend
        working-directory: packages/periplus
        run: uv sync --frozen
      - name: Compile backend
        working-directory: packages/periplus
        run: uv run python -m compileall src/periplus
      - name: Test backend
        working-directory: packages/periplus
        run: uv run python -m unittest discover -s tests
      - name: Test Python SDK
        working-directory: packages/periplus
        run: >-
          uv run --with ../periplus-python-sdk python -m unittest discover
          -s ../periplus-python-sdk/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:packages
      - run: npm run test:packages
      - run: npm run check:public
      - run: npm run build:public
      - run: npm run check:admin
      - run: npm run build:admin
      - name: Build public production image
        run: docker build --file docker/public/Dockerfile --tag periplus-public:ci .

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6
      - run: helm lint charts/periplus
      - name: Render homelab topology
        run: helm template periplus charts/periplus --namespace periplus > /tmp/periplus.yaml
