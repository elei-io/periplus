name: Publish images and chart

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/ekkuleivonen/periplus-core
  CHART_REGISTRY: oci://ghcr.io/ekkuleivonen/periplus-charts

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      image_tags: ${{ steps.release.outputs.image_tags }}
      chart_version: ${{ steps.release.outputs.chart_version }}
      app_version: ${{ steps.release.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve immutable versions
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          app_version="sha-${short_sha}"
          chart_version="0.1.0-dev.${short_sha}"
          image_tags="sha-${short_sha}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            app_version="${version}"
            chart_version="${version}"
            image_tags="${version},sha-${short_sha}"
          fi
          {
            echo "image_tags=${image_tags}"
            echo "chart_version=${chart_version}"
            echo "app_version=${app_version}"
          } >> "${GITHUB_OUTPUT}"

  core:
    name: Core image
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Build image tags
        shell: bash
        run: |
          IFS=',' read -ra versions <<< "${{ needs.metadata.outputs.image_tags }}"
          for version in "${versions[@]}"; do
            echo "${CORE_IMAGE}:${version}"
          done > /tmp/tags
          {
            echo "value<<EOF"
            cat /tmp/tags
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/periplus/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=periplus-core
          cache-to: type=gha,mode=max,scope=periplus-core
          provenance: mode=max
          sbom: true

  frontend:
    name: ${{ matrix.app }} image
    strategy:
      matrix:
        app: [admin, public]
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Build image tags
        shell: bash
        run: |
          IFS=',' read -ra versions <<< "${{ needs.metadata.outputs.image_tags }}"
          for version in "${versions[@]}"; do
            echo "ghcr.io/ekkuleivonen/periplus-${{ matrix.app }}:${version}"
          done > /tmp/tags
          {
            echo "value<<EOF"
            cat /tmp/tags
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}/Dockerfile
          build-args: ${{ matrix.app == 'public' && format('PERIPLUS_PUBLIC_ORIGIN={0}', vars.PERIPLUS_PUBLIC_ORIGIN) || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=periplus-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=periplus-${{ matrix.app }}
          provenance: mode=max
          sbom: true

  chart:
    name: Helm chart
    needs:
      - metadata
      - core
      - frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - run: helm lint charts/periplus
      - name: Package chart
        run: >-
          helm package charts/periplus
          --destination dist
          --version "${{ needs.metadata.outputs.chart_version }}"
          --app-version "${{ needs.metadata.outputs.app_version }}"
      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}" |
          helm registry login ghcr.io
          --username "${{ github.actor }}"
          --password-stdin
      - name: Publish chart
        run: helm push dist/periplus-*.tgz "${CHART_REGISTRY}"
