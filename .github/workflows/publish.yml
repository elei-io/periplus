name: Publish images and chart

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/elei-io/periplus-core
  CHART_REGISTRY: oci://ghcr.io/elei-io/periplus-charts

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      image_tags: ${{ steps.release.outputs.image_tags }}
      chart_version: ${{ steps.release.outputs.chart_version }}
      app_version: ${{ steps.release.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        name: Resolve immutable versions
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          app_version="sha-${short_sha}"
          chart_version="0.1.0-dev.${short_sha}"
          image_tags="sha-${short_sha}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            app_version="${version}"
            chart_version="${version}"
            image_tags="${version},sha-${short_sha}"
          fi
          {
            echo "image_tags=${image_tags}"
            echo "chart_version=${chart_version}"
            echo "app_version=${app_version}"
          } >> "${GITHUB_OUTPUT}"

  core:
    name: Core image
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Build image tags
        shell: bash
        run: |
          IFS=',' read -ra versions <<< "${{ needs.metadata.outputs.image_tags }}"
          for version in "${versions[@]}"; do
            echo "${CORE_IMAGE}:${version}"
          done > /tmp/tags
          {
            echo "value<<EOF"
            cat /tmp/tags
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/periplus/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=periplus-core
          cache-to: type=gha,mode=max,scope=periplus-core
          provenance: mode=max
          sbom: true

  frontend:
    name: ${{ matrix.app }} image
    strategy:
      matrix:
        app: [admin, public]
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Build image tags
        shell: bash
        run: |
          IFS=',' read -ra versions <<< "${{ needs.metadata.outputs.image_tags }}"
          for version in "${versions[@]}"; do
            echo "ghcr.io/elei-io/periplus-${{ matrix.app }}:${version}"
          done > /tmp/tags
          {
            echo "value<<EOF"
            cat /tmp/tags
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.app }}/Dockerfile
          build-args: |
            ${{ matrix.app == 'public' && format('PERIPLUS_PUBLIC_ORIGIN={0}', vars.PERIPLUS_PUBLIC_ORIGIN) || '' }}
            ${{ matrix.app == 'public' && format('NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN={0}', vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN) || '' }}
            ${{ matrix.app == 'public' && format('NEXT_PUBLIC_POSTHOG_HOST={0}', vars.NEXT_PUBLIC_POSTHOG_HOST) || '' }}
            ${{ matrix.app == 'public' && 'NEXT_PUBLIC_ANALYTICS_ENVIRONMENT=production' || '' }}
            ${{ matrix.app == 'public' && format('NEXT_PUBLIC_RELEASE={0}', github.sha) || '' }}
            ${{ matrix.app == 'public' && format('POSTHOG_PROJECT_ID={0}', vars.POSTHOG_PROJECT_ID) || '' }}
          secrets: |
            posthog_api_key=${{ matrix.app == 'public' && secrets.POSTHOG_API_KEY || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=periplus-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=periplus-${{ matrix.app }}
          provenance: mode=max
          sbom: true

  chart:
    name: Helm chart
    needs:
      - metadata
      - core
      - frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6
      - run: helm lint charts/periplus
      - name: Package chart
        run: >-
          helm package charts/periplus
          --destination dist
          --version "${{ needs.metadata.outputs.chart_version }}"
          --app-version "${{ needs.metadata.outputs.app_version }}"
      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}" |
          helm registry login ghcr.io
          --username "${{ github.actor }}"
          --password-stdin
      - name: Publish chart
        run: helm push dist/periplus-*.tgz "${CHART_REGISTRY}"
