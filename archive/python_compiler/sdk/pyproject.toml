[project]
name = "atlas-sdk"
version = "0.1.0"
description = "Typed Python client for the Atlas API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_sdk = ["py.typed"]
