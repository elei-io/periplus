apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "atlas.fullname" . }}-setup
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.setup.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.setup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "atlas.componentSelectorLabels" (dict "root" . "component" "setup") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- include "atlas.backendPodSpec" . | nindent 6 }}
      containers:
        - name: setup
          image: {{ include "atlas.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [atlas-setup]
          {{- include "atlas.envFrom" . | nindent 10 }}
          env:
            {{- include "atlas.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
