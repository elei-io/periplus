# External Postgres, NATS, ClickHouse, raw S3 and CDP services are required.
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
images:
  core:
    repository: ghcr.io/elei-io/periplus-core
    tag: ''
    pullPolicy: IfNotPresent
  admin:
    repository: ghcr.io/elei-io/periplus-admin
    tag: ''
    pullPolicy: IfNotPresent
  public:
    repository: ghcr.io/elei-io/periplus-public
    tag: ''
    pullPolicy: IfNotPresent
secrets:
  apiAccess:
    name: periplus-api-access
    adminTokenKey: ADMIN_API_TOKEN
    publicTokenKey: PUBLIC_API_TOKEN
    queryTokenKey: QUERY_API_TOKEN
  controlDatabase:
    name: postgres-periplus-control
    urlKey: DATABASE_URL
  nats:
    name: nats-periplus
    urlKey: NATS_URL
    seedKey: NATS_SEED
  s3:
    name: s3-periplus
    endpointKey: ENDPOINT
    regionKey: REGION
    bucketKey: BUCKET
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: SECRET_ACCESS_KEY
  clickhouse:
    name: periplus-clickhouse-writer
    userKey: USERNAME
    passwordKey: PASSWORD
  queryClickhouse:
    name: periplus-clickhouse-reader
    userKey: USERNAME
    passwordKey: PASSWORD
config:
  cdpUrl: http://browserless.browserless.svc.cluster.local:3000
  logLevel: INFO
  repository:
    prefix: repository
    s3UrlStyle: path
    s3UseSSL: true
  nats:
    operationalReplicas: 3
    catalogueWorkStreamReplicas: 3
  clickhouse:
    url: http://clickhouse:8123
    queryWorkload: default
extraEnvFrom: []
extraEnv: []
api:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    metric: cpu
    threshold: '70'
    query: ''
    behavior: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8000
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path: /metrics
      prometheus.io/port: '8000'
admin:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    metric: cpu
    threshold: '70'
    query: ''
    behavior: {}
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}
public:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    metric: cpu
    threshold: '70'
    query: ''
    behavior: {}
  ai:
    model: ''
    existingSecret: ''
    apiKeyKey: OPENAI_API_KEY
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}
crawler:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    metric: prometheus
    threshold: '8.4'
    query: ''
    behavior: {}
  duckdb:
    threads: 1
    memoryLimit: 128MB
    maxTempDirectorySize: 128MB
  discovery:
    model: ''
    existingSecret: ''
    openaiKeyKey: OPENAI_API_KEY
    braveKeyKey: BRAVE_SEARCH_API_KEY
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
ingestor:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    metric: cpu
    threshold: '70'
    query: ''
    behavior: {}
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
materializer:
  image: "" # Pin the serving recipe independently during public-only releases.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    metric: cpu
    threshold: '70'
    query: ''
    behavior: {}
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
janitor:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
setup:
  refreshPublicViews: false # Maintenance only; requires compatible material columns.
  restoreManifest: ''
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
metricsService:
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 330
query:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    metric: prometheus
    threshold: '0.7'
    query: ''
    behavior: {}
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8000
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path: /metrics
      prometheus.io/port: '8000'
autoscaling:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
  prometheus:
    serverAddress: ''
    authenticationRef: {}
    metadata: {}
  pollingInterval: 15
podMonitor:
  enabled: false
  labels: {}
  interval: 15s
  scrapeTimeout: 10s
upgradeCoordination:
  enabled: false
  timeoutSeconds: 600
