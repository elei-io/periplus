nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  core:
    repository: ghcr.io/ekkuleivonen/periplus-core
    tag: ""
    pullPolicy: IfNotPresent
  admin:
    repository: ghcr.io/ekkuleivonen/periplus-admin
    tag: ""
    pullPolicy: IfNotPresent
  public:
    repository: ghcr.io/ekkuleivonen/periplus-public
    tag: ""
    pullPolicy: IfNotPresent

# Periplus deliberately does not install PostgreSQL, NATS, S3, or a CDP service.
# These references bind the chart to credentials projected by the platform.
secrets:
  apiAccess:
    name: periplus-api-access
    adminTokenKey: ADMIN_API_TOKEN
    publicTokenKey: PUBLIC_API_TOKEN
    receiptSecretKey: PUBLIC_RECEIPT_SECRET
  controlDatabase:
    name: postgres-periplus-control
    urlKey: DATABASE_URL
  ducklakeMetadata:
    name: postgres-periplus-lake
    # Periplus normalizes this standard URL into DuckLake's postgres: attach form.
    pathKey: DATABASE_URL
  nats:
    name: nats-periplus
    urlKey: NATS_URL
    seedKey: NATS_SEED
  s3:
    name: s3-periplus
    endpointKey: ENDPOINT
    regionKey: REGION
    bucketKey: BUCKET
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: SECRET_ACCESS_KEY

config:
  cdpUrl: http://browserless.browserless.svc.cluster.local:3000
  logLevel: INFO
  ducklake:
    alias: periplus
    metadataSchema: ducklake
    dataPath: s3://periplus/ducklake/
    # DuckDB expects host[:port] here, without an http(s) scheme.
    s3Endpoint: s3.elei.io:9000
    s3UrlStyle: path
    s3UseSSL: true
  repository:
    prefix: repository
    s3UrlStyle: path
    s3UseSSL: true
  nats:
    graphStreamReplicas: 3
    catalogueWorkStreamReplicas: 3
    ingestResultReplicas: 3

# Additional optional Periplus settings.
extraEnvFrom: []
extraEnv: []

api:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8000
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8000"

admin:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}

public:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}

crawler:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

ingestor:
  replicas: 2
  concurrency: 4
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

materializer:
  replicas: 2
  concurrency: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

janitor:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

setup:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

metricsService:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 30
