apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "periplus.fullname" . }}-api
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "periplus.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "periplus.componentSelectorLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "periplus.corePodSpec" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "periplus.coreImage" . | quote }}
          imagePullPolicy: {{ .Values.images.core.pullPolicy }}
          command: [fastapi, run, src/periplus/entrypoints/api.py, --host, 0.0.0.0, --port, "8000"]
          workingDir: /app/packages/periplus
          ports:
            - name: http
              containerPort: 8000
          {{- include "periplus.envFrom" . | nindent 10 }}
          env:
            {{- include "periplus.coreEnv" . | nindent 12 }}
            - name: PERIPLUS_ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiAccess.name }}
                  key: {{ .Values.secrets.apiAccess.adminTokenKey }}
            - name: PERIPLUS_PUBLIC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiAccess.name }}
                  key: {{ .Values.secrets.apiAccess.publicTokenKey }}
            - name: PERIPLUS_COVERAGE_MODEL
              value: {{ .Values.api.coverage.model | quote }}
            {{- if .Values.api.coverage.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.coverage.existingSecret }}
                  key: {{ .Values.api.coverage.openaiKeyKey }}
            - name: BRAVE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.coverage.existingSecret }}
                  key: {{ .Values.api.coverage.braveKeyKey }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
