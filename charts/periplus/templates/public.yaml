apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "periplus.fullname" . }}-public
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
    app.kubernetes.io/component: public
spec:
  replicas: {{ .Values.public.replicas }}
  selector:
    matchLabels:
      {{- include "periplus.componentSelectorLabels" (dict "root" . "component" "public") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "periplus.componentSelectorLabels" (dict "root" . "component" "public") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "periplus.podPlacement" . | nindent 6 }}
      containers:
        - name: public
          image: {{ include "periplus.publicImage" . | quote }}
          imagePullPolicy: {{ .Values.images.public.pullPolicy }}
          env:
            - name: PERIPLUS_API_URL
              value: {{ printf "http://%s-api:%v" (include "periplus.fullname" .) .Values.api.service.port | quote }}
            - name: PERIPLUS_PUBLIC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiAccess.name }}
                  key: {{ .Values.secrets.apiAccess.publicTokenKey }}
            - name: PERIPLUS_PUBLIC_RECEIPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiAccess.name }}
                  key: {{ .Values.secrets.apiAccess.receiptSecretKey }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
          resources:
            {{- toYaml .Values.public.resources | nindent 12 }}
