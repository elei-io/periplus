apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "periplus.fullname" . }}-web
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "periplus.componentSelectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "periplus.componentSelectorLabels" (dict "root" . "component" "web") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "periplus.podPlacement" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "periplus.webImage" . | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          env:
            - name: PERIPLUS_API_HOST
              value: {{ printf "%s-api" (include "periplus.fullname" .) | quote }}
            - name: PERIPLUS_API_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
