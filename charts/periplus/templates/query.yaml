{{- $root := . -}}
{{- range $mode := list "stable" "experimental" }}
{{- $component := ternary "query" "query-experimental" (eq $mode "stable") }}
{{- $config := ternary $root.Values.query $root.Values.queryExperimental (eq $mode "stable") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "periplus.fullname" $root }}-{{ $component }}
  labels:
    {{- include "periplus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
{{- if not $config.autoscaling.enabled }}
  replicas: {{ $config.replicas }}
{{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "periplus.componentSelectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "periplus.componentSelectorLabels" (dict "root" $root "component" $component) | nindent 8 }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "periplus.corePodSpec" $root | nindent 6 }}
      containers:
        - name: {{ $component }}
          image: {{ include "periplus.coreImage" $root | quote }}
          imagePullPolicy: {{ $root.Values.images.core.pullPolicy }}
          command: [fastapi, run, src/periplus/entrypoints/query.py, --host, 0.0.0.0, --port, "8000"]
          workingDir: /app/packages/periplus
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PERIPLUS_QUERY_MODE
              value: {{ $mode | quote }}
            {{- include "periplus.duckdbEnv" $config.duckdb | nindent 12 }}
            - name: PERIPLUS_API_URL
              value: "http://{{ include "periplus.fullname" $root }}-api:{{ $root.Values.api.service.port }}"
            - name: PERIPLUS_SERVICE_VERSION
              value: {{ $root.Values.images.core.tag | quote }}
            - name: PERIPLUS_QUERY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.apiAccess.name }}
                  key: {{ $root.Values.secrets.apiAccess.queryTokenKey }}
            - name: PERIPLUS_DUCKLAKE_METADATA_PATH
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.queryDucklakeMetadata.name }}
                  key: {{ $root.Values.secrets.queryDucklakeMetadata.pathKey }}
            - name: PERIPLUS_DUCKLAKE_ALIAS
              value: {{ $root.Values.config.ducklake.alias | quote }}
            - name: PERIPLUS_DUCKLAKE_METADATA_SCHEMA
              value: {{ $root.Values.config.ducklake.metadataSchema | quote }}
            - name: PERIPLUS_DUCKLAKE_DATA_PATH
              value: {{ $root.Values.config.ducklake.dataPath | quote }}
            - name: PERIPLUS_DUCKLAKE_S3_ENDPOINT
              value: {{ $root.Values.config.ducklake.s3Endpoint | quote }}
            - name: PERIPLUS_DUCKLAKE_S3_URL_STYLE
              value: {{ $root.Values.config.ducklake.s3UrlStyle | quote }}
            - name: PERIPLUS_DUCKLAKE_S3_USE_SSL
              value: {{ $root.Values.config.ducklake.s3UseSSL | quote }}
            - name: PERIPLUS_DUCKLAKE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.queryS3.name }}
                  key: {{ $root.Values.secrets.queryS3.regionKey }}
            - name: PERIPLUS_DUCKLAKE_S3_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.queryS3.name }}
                  key: {{ $root.Values.secrets.queryS3.accessKeyIdKey }}
            - name: PERIPLUS_DUCKLAKE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.queryS3.name }}
                  key: {{ $root.Values.secrets.queryS3.secretAccessKeyKey }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $config.resources | nindent 12 }}

{{- end }}
