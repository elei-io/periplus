services:
  atlas-nats:
    image: nats:2.11-alpine
    container_name: atlas-nats
    command: ["--config", "/etc/nats/atlas-local.conf"]
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - atlas-nats-data:/data
      - ./docker/nats/local.conf:/etc/nats/atlas-local.conf:ro
    restart: unless-stopped

  atlas-api:
    environment: &atlas-local-nats-environment
      NATS_URL: nats://atlas-nats:4222
      NATS_SEED: ""
    depends_on:
      atlas-nats:
        condition: service_healthy

  atlas-acquisition-worker:
    environment: *atlas-local-nats-environment
    depends_on:
      atlas-nats:
        condition: service_healthy

  atlas-ingestion-worker:
    environment: *atlas-local-nats-environment
    depends_on:
      atlas-nats:
        condition: service_healthy

  atlas-materialization-worker:
    environment: *atlas-local-nats-environment
    depends_on:
      atlas-nats:
        condition: service_healthy

  atlas-catalogue-relay:
    environment: *atlas-local-nats-environment
    depends_on:
      atlas-nats:
        condition: service_healthy

  atlas-maintenance-worker:
    environment: *atlas-local-nats-environment
    depends_on:
      atlas-nats:
        condition: service_healthy

volumes:
  atlas-nats-data:
