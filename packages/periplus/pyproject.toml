[project]
name = "periplus"
version = "0.1.0"
description = "Web acquisition and normalization for SQL-centric data pipelines"
readme = { text = "Periplus backend services.", content-type = "text/markdown" }
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28",
    "nats-py[nkeys]>=2.11",
    "playwright==1.55.0",
    "magika>=1.0,<2",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.22",
    "pydantic>=2.12",
    "pytz>=2025.2",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.0",
    "tldextract>=5.3",
    "boto3>=1.42",
    "zstandard>=0.25",
    "html5lib>=1.1",
    "croniter>=6.0",
    "pyarrow>=21",
    "sqlglot>=27",
    "duckdb==1.5.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.5",
]

[project.scripts]
periplus-setup = "periplus.entrypoints.setup:main"
periplus-worker = "periplus.entrypoints.worker:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "build*"]

[tool.setuptools.package-data]
"periplus.platform.postgres" = [
    "alembic.ini",
    "alembic/script.py.mako",
]
"periplus.platform.catalogue" = [
    "sql/content/views/*.sql",
    "sql/web/views/*.sql",
]
