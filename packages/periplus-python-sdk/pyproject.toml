[project]
name = "periplus-python-sdk"
version = "0.1.0"
description = "Python connections and crawl lifecycle client for Periplus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "httpx>=0.28",
    "python-dotenv>=1.2",
]

[project.urls]
Repository = "https://github.com/ekkuleivonen/periplus"
Issues = "https://github.com/ekkuleivonen/periplus/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
periplus_sdk = ["py.typed"]
