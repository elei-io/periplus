services:
  atlas-quack:
    build:
      context: .
      dockerfile: docker/quack/Dockerfile
    image: atlas-quack:local
    container_name: atlas-quack
    ports:
      - "127.0.0.1:9494:9494"
    expose:
      - "9495"
    environment:
      ATLAS_CATALOGUE_CATALOG: postgres
      ATLAS_CATALOGUE_CATALOG_DSN: "host=atlas-postgres port=5432 dbname=${POSTGRES_CATALOGUE_DB:-atlas_catalogue} user=${POSTGRES_USER:-atlas} password=${POSTGRES_PASSWORD:-atlas}"
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_CATALOGUE_DATA_INLINING_ROW_LIMIT: ${ATLAS_CATALOGUE_DATA_INLINING_ROW_LIMIT:-10}
      ATLAS_CATALOGUE_OVERRIDE_DATA_PATH: "false"
      ATLAS_CATALOGUE_DUCKDB_DATABASE: ":memory:"
      ATLAS_CATALOGUE_DUCKDB_THREADS: ${ATLAS_QUACK_DUCKDB_THREADS:-}
      ATLAS_CATALOGUE_DUCKDB_MEMORY_LIMIT: ${ATLAS_QUACK_DUCKDB_MEMORY_LIMIT:-}
      ATLAS_CATALOGUE_DUCKDB_MAX_TEMP_SIZE: ${ATLAS_QUACK_DUCKDB_MAX_TEMP_SIZE:-}
      ATLAS_CATALOGUE_DUCKDB_TEMP_DIRECTORY: ${ATLAS_QUACK_DUCKDB_TEMP_DIRECTORY:-}
      ATLAS_REPOSITORY_STORAGE: s3
      ATLAS_REPOSITORY_ROOT: /tmp/atlas-repository
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_PREFIX: ${ATLAS_REPOSITORY_S3_PREFIX:-}
      ATLAS_REPOSITORY_S3_ENDPOINT: http://atlas-minio:9000
      ATLAS_REPOSITORY_S3_REGION: us-east-1
      ATLAS_REPOSITORY_S3_KEY_ID: ${MINIO_ROOT_USER:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-atlas-secret}
      ATLAS_REPOSITORY_S3_URL_STYLE: path
      ATLAS_REPOSITORY_S3_USE_SSL: "false"
      ATLAS_QUACK_HOST: 0.0.0.0
      ATLAS_QUACK_PORT: 9494
      ATLAS_QUACK_TOKEN: ${ATLAS_QUACK_TOKEN:-atlas-local-quack}
      ATLAS_QUACK_HEALTH_HOST: 0.0.0.0
      ATLAS_QUACK_HEALTH_PORT: 9495
      ATLAS_QUACK_CDC_EXTENSION_PATH: /opt/duckdb/extensions/ducklake_cdc.duckdb_extension
      ATLAS_DUCKLAKE_CDC_VERSION: ${ATLAS_DUCKLAKE_CDC_VERSION:-ducklake_cdc 0.5.3}
      ATLAS_DUCKLAKE_CDC_BUILD_REVISION: ${ATLAS_DUCKLAKE_CDC_BUILD_REVISION:-3d41ff7}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9495/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      atlas-postgres:
        condition: service_healthy
      atlas-minio-init:
        condition: service_completed_successfully
      atlas-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  atlas-api:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    container_name: atlas-api
    working_dir: /app/backend
    command: fastapi dev api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./.atlas/repository:/app/.atlas/repository
    environment:
      ATLAS_BROWSER_CONCURRENCY: ${ATLAS_BROWSER_CONCURRENCY:-12}
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_CATALOGUE_READ_POOL_SIZE: ${ATLAS_CATALOGUE_READ_POOL_SIZE:-2}
      ATLAS_CATALOGUE_READ_THREADS: ${ATLAS_CATALOGUE_READ_THREADS:-2}
      ATLAS_CATALOGUE_READ_POOL_WAIT_SECONDS: ${ATLAS_CATALOGUE_READ_POOL_WAIT_SECONDS:-5}
      ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
      ATLAS_REPOSITORY_ROOT: /app/.atlas/repository
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_PREFIX: ${ATLAS_REPOSITORY_S3_PREFIX:-}
      ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:-http://atlas-minio:9000}
      ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
      ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-atlas-secret}
      ATLAS_REPOSITORY_S3_SESSION_TOKEN: ${ATLAS_REPOSITORY_S3_SESSION_TOKEN:-}
      ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
      ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-false}
      ATLAS_QUACK_URL: ${ATLAS_QUACK_URL:-quack:atlas-quack:9494}
      ATLAS_QUACK_CLIENT_TOKEN: ${ATLAS_QUACK_CLIENT_TOKEN:-atlas-local-quack}
      ATLAS_QUACK_DISABLE_SSL: ${ATLAS_QUACK_DISABLE_SSL:-true}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      NATS_URL: nats://atlas-nats:4222
      NATS_RETENTION: ${NATS_RETENTION:-5m}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai/gpt-5.5}
      OPENROUTER_SCHEMA_MODEL: ${OPENROUTER_SCHEMA_MODEL:-openai/gpt-5.5}
      OPENROUTER_SEARCH_EXTRACTOR_MODEL: ${OPENROUTER_SEARCH_EXTRACTOR_MODEL:-openai/gpt-5.5}
      OPENROUTER_QUERY_PARAM_MODEL: ${OPENROUTER_QUERY_PARAM_MODEL:-openai/gpt-5.5}
    depends_on:
      atlas-quack:
        condition: service_healthy
      atlas-postgres:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy

  atlas-runtime-worker:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    working_dir: /app/backend
    command: python -m runtime.worker
    volumes:
      - .:/app
      - ./.atlas/repository:/app/.atlas/repository
    expose:
      - "9090"
    environment:
      ATLAS_RUNTIME_WORKER_POLL_SECONDS: ${ATLAS_RUNTIME_WORKER_POLL_SECONDS:-5}
      ATLAS_TASK_RUN_TIMEOUT_SECONDS: ${ATLAS_TASK_RUN_TIMEOUT_SECONDS:-1800}
      ATLAS_SCHEDULER_BATCH_SIZE: ${ATLAS_SCHEDULER_BATCH_SIZE:-20}
      ATLAS_RUNTIME_WORKER_ID: ${ATLAS_RUNTIME_WORKER_ID:-}
      ATLAS_RUNTIME_WORKER_CONCURRENCY: ${ATLAS_RUNTIME_WORKER_CONCURRENCY:-4}
      ATLAS_TASK_STREAM_REPLICAS: ${ATLAS_TASK_STREAM_REPLICAS:-1}
      ATLAS_TASK_ACK_WAIT_SECONDS: ${ATLAS_TASK_ACK_WAIT_SECONDS:-60}
      ATLAS_TASK_RUN_STATE_MAX_BYTES: ${ATLAS_TASK_RUN_STATE_MAX_BYTES:-268435456}
      ATLAS_RUNTIME_WORKER_PRESENCE_TTL_SECONDS: ${ATLAS_RUNTIME_WORKER_PRESENCE_TTL_SECONDS:-30}
      ATLAS_CRAWL_CONCURRENCY_PER_RUN: ${ATLAS_CRAWL_CONCURRENCY_PER_RUN:-3}
      ATLAS_BROWSER_CONCURRENCY: ${ATLAS_BROWSER_CONCURRENCY:-12}
      ATLAS_CRAWL_PERMIT_TIMEOUT_SECONDS: ${ATLAS_CRAWL_PERMIT_TIMEOUT_SECONDS:-120}
      ATLAS_INDEX_PAGE_BATCH_SIZE: ${ATLAS_INDEX_PAGE_BATCH_SIZE:-32}
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
      ATLAS_REPOSITORY_ROOT: /app/.atlas/repository
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_PREFIX: ${ATLAS_REPOSITORY_S3_PREFIX:-}
      ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:-http://atlas-minio:9000}
      ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
      ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-atlas-secret}
      ATLAS_REPOSITORY_S3_SESSION_TOKEN: ${ATLAS_REPOSITORY_S3_SESSION_TOKEN:-}
      ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
      ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-false}
      ATLAS_QUACK_URL: ${ATLAS_QUACK_URL:-quack:atlas-quack:9494}
      ATLAS_QUACK_CLIENT_TOKEN: ${ATLAS_QUACK_CLIENT_TOKEN:-atlas-local-quack}
      ATLAS_QUACK_DISABLE_SSL: ${ATLAS_QUACK_DISABLE_SSL:-true}
      ATLAS_REPOSITORY_MAX_HTML_BYTES: ${ATLAS_REPOSITORY_MAX_HTML_BYTES:-67108864}
      ATLAS_INGEST_RESULT_POLL_SECONDS: ${ATLAS_INGEST_RESULT_POLL_SECONDS:-0.5}
      ATLAS_INGEST_RESULT_TTL_SECONDS: ${ATLAS_INGEST_RESULT_TTL_SECONDS:-604800}
      ATLAS_INGEST_RESULT_MAX_BYTES: ${ATLAS_INGEST_RESULT_MAX_BYTES:-268435456}
      ATLAS_INGEST_RESULT_REPLICAS: ${ATLAS_INGEST_RESULT_REPLICAS:-1}
      ATLAS_NATS_MAX_ENVELOPE_BYTES: ${ATLAS_NATS_MAX_ENVELOPE_BYTES:-921600}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ATLAS_CACHE_MAX_AGE_SECONDS: ${ATLAS_CACHE_MAX_AGE_SECONDS:-120}
      ATLAS_CACHE_STALE_IF_ERROR_SECONDS: ${ATLAS_CACHE_STALE_IF_ERROR_SECONDS:-}
      ATLAS_LOG_FORMAT: ${ATLAS_LOG_FORMAT:-text}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      ATLAS_METRICS_ENABLED: ${ATLAS_METRICS_ENABLED:-true}
      ATLAS_METRICS_HOST: ${ATLAS_METRICS_HOST:-0.0.0.0}
      ATLAS_RUNTIME_WORKER_METRICS_PORT: ${ATLAS_RUNTIME_WORKER_METRICS_PORT:-9090}
      ATLAS_EXTRACT_MAX_ATTEMPTS: ${ATLAS_EXTRACT_MAX_ATTEMPTS:-2}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      NATS_URL: nats://atlas-nats:4222
      NATS_RETENTION: ${NATS_RETENTION:-5m}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai/gpt-5.5}
      OPENROUTER_SCHEMA_MODEL: ${OPENROUTER_SCHEMA_MODEL:-openai/gpt-5.5}
      OPENROUTER_SEARCH_EXTRACTOR_MODEL: ${OPENROUTER_SEARCH_EXTRACTOR_MODEL:-openai/gpt-5.5}
      OPENROUTER_QUERY_PARAM_MODEL: ${OPENROUTER_QUERY_PARAM_MODEL:-openai/gpt-5.5}
    depends_on:
      atlas-quack:
        condition: service_healthy
      atlas-postgres:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
      atlas-repository-worker:
        condition: service_healthy

  atlas-repository-worker:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    working_dir: /app/backend
    command: python -m repository.worker
    volumes:
      - .:/app
      - ./.atlas/repository:/app/.atlas/repository
    expose:
      - "9091"
      - "9092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
      ATLAS_REPOSITORY_ROOT: /app/.atlas/repository
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_PREFIX: ${ATLAS_REPOSITORY_S3_PREFIX:-}
      ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:-http://atlas-minio:9000}
      ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
      ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-atlas-secret}
      ATLAS_REPOSITORY_S3_SESSION_TOKEN: ${ATLAS_REPOSITORY_S3_SESSION_TOKEN:-}
      ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
      ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-false}
      ATLAS_QUACK_URL: ${ATLAS_QUACK_URL:-quack:atlas-quack:9494}
      ATLAS_QUACK_CLIENT_TOKEN: ${ATLAS_QUACK_CLIENT_TOKEN:-atlas-local-quack}
      ATLAS_QUACK_DISABLE_SSL: ${ATLAS_QUACK_DISABLE_SSL:-true}
      ATLAS_REPOSITORY_MAX_HTML_BYTES: ${ATLAS_REPOSITORY_MAX_HTML_BYTES:-67108864}
      ATLAS_REPOSITORY_MAX_DOCUMENT_ELEMENTS: ${ATLAS_REPOSITORY_MAX_DOCUMENT_ELEMENTS:-1000000}
      ATLAS_REPOSITORY_MAX_DOCUMENT_STAGED_BYTES: ${ATLAS_REPOSITORY_MAX_DOCUMENT_STAGED_BYTES:-268435456}
      ATLAS_INGEST_BATCH_ITEMS: ${ATLAS_INGEST_BATCH_ITEMS:-100}
      ATLAS_INGEST_BATCH_ELEMENT_ROWS: ${ATLAS_INGEST_BATCH_ELEMENT_ROWS:-250000}
      ATLAS_INGEST_BATCH_BYTES: ${ATLAS_INGEST_BATCH_BYTES:-268435456}
      ATLAS_INGEST_BATCH_WAIT_SECONDS: ${ATLAS_INGEST_BATCH_WAIT_SECONDS:-0.5}
      ATLAS_INGEST_ACK_WAIT_SECONDS: ${ATLAS_INGEST_ACK_WAIT_SECONDS:-600}
      ATLAS_INGEST_MAX_ACK_PENDING: ${ATLAS_INGEST_MAX_ACK_PENDING:-1000}
      ATLAS_INGEST_MAX_DELIVER: ${ATLAS_INGEST_MAX_DELIVER:-5}
      ATLAS_NATS_MAX_ENVELOPE_BYTES: ${ATLAS_NATS_MAX_ENVELOPE_BYTES:-921600}
      ATLAS_INGEST_RESULT_TTL_SECONDS: ${ATLAS_INGEST_RESULT_TTL_SECONDS:-604800}
      ATLAS_INGEST_RESULT_MAX_BYTES: ${ATLAS_INGEST_RESULT_MAX_BYTES:-268435456}
      ATLAS_INGEST_RESULT_REPLICAS: ${ATLAS_INGEST_RESULT_REPLICAS:-1}
      ATLAS_INGEST_STAGING_CLEANUP_INTERVAL_SECONDS: ${ATLAS_INGEST_STAGING_CLEANUP_INTERVAL_SECONDS:-900}
      ATLAS_INGEST_STAGING_GRACE_SECONDS: ${ATLAS_INGEST_STAGING_GRACE_SECONDS:-3600}
      ATLAS_REPOSITORY_COMPACTION_ENABLED: ${ATLAS_REPOSITORY_COMPACTION_ENABLED:-true}
      ATLAS_REPOSITORY_COMPACTION_INTERVAL_SECONDS: ${ATLAS_REPOSITORY_COMPACTION_INTERVAL_SECONDS:-300}
      ATLAS_REPOSITORY_COMPACTION_MIN_FILES: ${ATLAS_REPOSITORY_COMPACTION_MIN_FILES:-64}
      ATLAS_REPOSITORY_COMPACTION_MAX_INPUT_FILE_BYTES: ${ATLAS_REPOSITORY_COMPACTION_MAX_INPUT_FILE_BYTES:-1048576}
      ATLAS_REPOSITORY_COMPACTION_TARGET_FILE_BYTES: ${ATLAS_REPOSITORY_COMPACTION_TARGET_FILE_BYTES:-33554432}
      ATLAS_REPOSITORY_COMPACTION_MAX_OUTPUT_FILES: ${ATLAS_REPOSITORY_COMPACTION_MAX_OUTPUT_FILES:-4}
      ATLAS_REPOSITORY_COMPACTION_MAX_OPERATION_BYTES: ${ATLAS_REPOSITORY_COMPACTION_MAX_OPERATION_BYTES:-268435456}
      ATLAS_REPOSITORY_CLEANUP_OLD_FILES_SECONDS: ${ATLAS_REPOSITORY_CLEANUP_OLD_FILES_SECONDS:-604800}
      NATS_URL: nats://atlas-nats:4222
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      ATLAS_METRICS_ENABLED: ${ATLAS_METRICS_ENABLED:-true}
      ATLAS_METRICS_HOST: ${ATLAS_METRICS_HOST:-0.0.0.0}
      ATLAS_REPOSITORY_WORKER_METRICS_PORT: ${ATLAS_REPOSITORY_WORKER_METRICS_PORT:-9091}
      ATLAS_REPOSITORY_WORKER_HEALTH_HOST: 0.0.0.0
      ATLAS_REPOSITORY_WORKER_HEALTH_PORT: 9092
    depends_on:
      atlas-quack:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-materialization-worker:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    working_dir: /app/backend
    command: python -m materialization.worker
    volumes:
      - .:/app
      - ./.atlas/repository:/app/.atlas/repository
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9093/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
      ATLAS_REPOSITORY_ROOT: /app/.atlas/repository
