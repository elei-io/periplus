x-atlas-backend: &atlas-backend
  build:
    context: .
    dockerfile: docker/atlas/Dockerfile
  image: atlas-backend:local
  working_dir: /app/backend

x-atlas-repository-volumes: &atlas-repository-volumes
  - ./.atlas/repository:/app/.atlas/repository

x-atlas-healthcheck: &atlas-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-atlas-control-environment: &atlas-control-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}

x-atlas-catalogue-environment: &atlas-catalogue-environment
  ATLAS_CATALOGUE_CATALOG: postgres
  ATLAS_CATALOGUE_CATALOG_DSN: "host=atlas-postgres port=5432 dbname=${POSTGRES_CATALOGUE_DB:-atlas_catalogue} user=${POSTGRES_USER:-atlas} password=${POSTGRES_PASSWORD:-atlas}"

x-atlas-nats-environment: &atlas-nats-environment
  NATS_URL: nats://atlas-nats:4222

x-atlas-repository-environment: &atlas-repository-environment
  ATLAS_REPOSITORY_STORAGE: s3
  ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
  ATLAS_REPOSITORY_S3_ENDPOINT: http://atlas-minio:9000
  ATLAS_REPOSITORY_S3_REGION: us-east-1
  ATLAS_REPOSITORY_S3_KEY_ID: ${MINIO_ROOT_USER:-atlas}
  ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-atlas-secret}
  ATLAS_REPOSITORY_S3_URL_STYLE: path
  ATLAS_REPOSITORY_S3_USE_SSL: "false"

x-atlas-resource-environment: &atlas-resource-environment
  ATLAS_CATALOGUE_MAX_CONCURRENCY: ${ATLAS_CATALOGUE_MAX_CONCURRENCY:-64}
  ATLAS_OBJECT_IO_MAX_CONCURRENCY: ${ATLAS_OBJECT_IO_MAX_CONCURRENCY:-64}

services:
  atlas-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: atlas-web:local
    container_name: atlas-web
    ports:
      - "127.0.0.1:${ATLAS_WEB_PORT:-8080}:80"
    depends_on:
      atlas-api:
        condition: service_healthy
    restart: unless-stopped

  atlas-api:
    <<: *atlas-backend
    container_name: atlas-api
    command: fastapi run api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()",
        ]
    volumes: *atlas-repository-volumes
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
    depends_on:
      atlas-postgres:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-acquisition-worker:
    <<: *atlas-backend
    command: atlas-worker acquisition
    deploy:
      replicas: 1
    volumes: *atlas-repository-volumes
    expose:
      - "9090"
      - "9099"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      CDP_URL: ${CDP_URL:-ws://host.docker.internal:8411/v1/connect}
      ATLAS_GRAPH_MAX_REQUESTS_PER_RUN: ${ATLAS_GRAPH_MAX_REQUESTS_PER_RUN:-10000}
      ATLAS_GRAPH_MAX_RUN_SECONDS: ${ATLAS_GRAPH_MAX_RUN_SECONDS:-3600}
    depends_on:
      atlas-postgres:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-ingestion-worker:
    <<: *atlas-backend
    command: atlas-worker ingestion
    deploy:
      replicas: 3
    volumes: *atlas-repository-volumes
    expose:
      - "9091"
      - "9092"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
      atlas-maintenance-worker:
        condition: service_healthy
    restart: unless-stopped

  atlas-materialization-worker:
    <<: *atlas-backend
    command: atlas-worker materialization
    volumes: *atlas-repository-volumes
    expose:
      - "9093"
      - "9096"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
      atlas-maintenance-worker:
        condition: service_healthy
    restart: unless-stopped

  atlas-maintenance-worker:
    <<: *atlas-backend
    command: atlas-worker maintenance
    volumes: *atlas-repository-volumes
    expose:
      - "9094"
      - "9095"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-setup:
    <<: *atlas-backend
    image: atlas-state-tools:local
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
      args:
        ATLAS_DUCKDB_EXTENSIONS: ducklake,parquet,postgres,httpfs,sqlite
    # Run the image-time package so schema changes require an explicit rebuild.
    command: python -m deployment
    volumes: *atlas-repository-volumes
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-repository-environment,
        ]
      ATLAS_CATALOGUE_DATA_INLINING_ROW_LIMIT: "10"
      ATLAS_CATALOGUE_OVERRIDE_DATA_PATH: "true"
    depends_on:
      atlas-postgres:
        condition: service_healthy
      atlas-minio-init:
        condition: service_completed_successfully
    restart: "no"

  atlas-nats:
    image: nats:2.11-alpine
    container_name: atlas-nats
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - atlas-nats-data:/data

  atlas-postgres:
    image: postgres:18
    container_name: atlas-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    restart: unless-stopped

  atlas-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: atlas-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - atlas-minio-data:/data
    restart: unless-stopped

  atlas-minio-init:
    <<: *atlas-backend
    command: python -m repository init-s3
    environment:
      <<: *atlas-repository-environment
      ATLAS_NAVIGATION_OBJECT_RETENTION_DAYS: "2"
    depends_on:
      atlas-minio:
        condition: service_healthy
    restart: "no"

volumes:
  atlas-postgres-data:
  atlas-nats-data:
  atlas-minio-data:
