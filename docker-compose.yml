x-atlas-backend: &atlas-backend
  build:
    context: .
    dockerfile: docker/atlas/Dockerfile
  image: atlas-backend:local
  working_dir: /app/backend

x-atlas-repository-volumes: &atlas-repository-volumes
  - ./.atlas/repository:/app/.atlas/repository

x-atlas-healthcheck: &atlas-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-atlas-control-environment: &atlas-control-environment
  DATABASE_URL: postgresql://atlas:atlas_local@atlas-test-postgres:5432/atlas_test

x-atlas-nats-environment: &atlas-nats-environment
  ATLAS_NATS_URL: nats://atlas-test-nats:4222
  ATLAS_NATS_SEED: ""

x-duckbasin-nats-environment: &duckbasin-nats-environment
  DUCKBASIN_NATS_URL: ${DUCKBASIN_NATS_URL:?DUCKBASIN_NATS_URL is required}
  DUCKBASIN_NATS_SEED: ${DUCKBASIN_NATS_SEED:?DUCKBASIN_NATS_SEED is required}

x-duckbasin-environment: &duckbasin-environment
  DUCKBASIN_URL: ${DUCKBASIN_URL:?DUCKBASIN_URL is required}
  DUCKBASIN_LAKE: ${DUCKBASIN_LAKE:?DUCKBASIN_LAKE is required}
  DUCKBASIN_TOKEN_ENDPOINT: ${DUCKBASIN_TOKEN_ENDPOINT:?DUCKBASIN_TOKEN_ENDPOINT is required}
  DUCKBASIN_CLIENT_ID: ${DUCKBASIN_CLIENT_ID:?DUCKBASIN_CLIENT_ID is required}
  DUCKBASIN_CLIENT_SECRET: ${DUCKBASIN_CLIENT_SECRET:?DUCKBASIN_CLIENT_SECRET is required}

x-atlas-repository-environment: &atlas-repository-environment
  ATLAS_REPOSITORY_STORAGE: s3
  ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:?ATLAS_REPOSITORY_S3_BUCKET is required}
  ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:?ATLAS_REPOSITORY_S3_ENDPOINT is required}
  ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:?ATLAS_REPOSITORY_S3_REGION is required}
  ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:?ATLAS_REPOSITORY_S3_KEY_ID is required}
  ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:?ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY is required}
  ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
  ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-true}

x-atlas-graph-environment: &atlas-graph-environment
  ATLAS_GRAPH_MAX_RUN_SECONDS: ${ATLAS_GRAPH_MAX_RUN_SECONDS:-604800}

x-atlas-quack-environment: &atlas-quack-environment
  ATLAS_QUACK_MAX_CONCURRENCY: ${ATLAS_QUACK_MAX_CONCURRENCY:-4}
  ATLAS_QUACK_POOL_WAIT_SECONDS: ${ATLAS_QUACK_POOL_WAIT_SECONDS:-5}
  ATLAS_QUACK_QUERY_TIMEOUT_SECONDS: ${ATLAS_QUACK_QUERY_TIMEOUT_SECONDS:-30}
  ATLAS_QUACK_QUERY_MAX_ROWS: ${ATLAS_QUACK_QUERY_MAX_ROWS:-100000}
  ATLAS_QUACK_QUERY_MAX_BYTES: ${ATLAS_QUACK_QUERY_MAX_BYTES:-67108864}
  ATLAS_QUACK_QUERY_STATE_TTL_SECONDS: ${ATLAS_QUACK_QUERY_STATE_TTL_SECONDS:-3600}
  ATLAS_QUACK_QUERY_STATE_MAX_BYTES: ${ATLAS_QUACK_QUERY_STATE_MAX_BYTES:-67108864}

services:
  atlas-test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_test
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - atlas-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-load-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_load
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - atlas-load-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_load"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-test-nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:5422:4222"
      - "127.0.0.1:5822:8222"
    volumes:
      - atlas-test-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-load-nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:5423:4222"
      - "127.0.0.1:5823:8222"
    volumes:
      - atlas-load-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: atlas-web:local
    container_name: atlas-web
    ports:
      - "127.0.0.1:${ATLAS_WEB_PORT:-8080}:80"
    depends_on:
      atlas-api:
        condition: service_healthy
    restart: unless-stopped

  atlas-api:
    <<: *atlas-backend
    container_name: atlas-api
    command: fastapi run api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *duckbasin-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
          *atlas-quack-environment,
        ]
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATLAS_AI_MODEL: ${ATLAS_AI_MODEL:-openai:gpt-5.6-luna}
      ATLAS_AI_MODEL_TIMEOUT_SECONDS: ${ATLAS_AI_MODEL_TIMEOUT_SECONDS:-180}
      ATLAS_AI_REQUEST_LIMIT: ${ATLAS_AI_REQUEST_LIMIT:-32}
      ATLAS_AI_TOOL_CALL_LIMIT: ${ATLAS_AI_TOOL_CALL_LIMIT:-24}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-acquisition-worker:
    <<: *atlas-backend
    command: atlas-worker acquisition
    deploy:
      replicas: 2
    expose:
      - "9090"
      - "9099"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *duckbasin-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      CDP_URL: ${CDP_URL:-ws://192.168.30.201:8411/v1/connect}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-ingestion-worker:
    <<: *atlas-backend
    command: atlas-worker ingestion
    deploy:
      replicas: 1
    volumes: *atlas-repository-volumes
    expose:
      - "9091"
      - "9092"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *duckbasin-environment,
          *atlas-repository-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-materialization-worker:
    <<: *atlas-backend
    command: atlas-worker materialization
    deploy:
      replicas: 1
    expose:
      - "9093"
      - "9096"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *duckbasin-environment,
        ]
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-catalogue-relay:
        condition: service_healthy
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-catalogue-relay:
    <<: *atlas-backend
    command: atlas-worker catalogue-relay
    expose:
      - "9097"
      - "9098"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9098/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-nats-environment,
          *duckbasin-nats-environment,
          *duckbasin-environment,
        ]
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-housekeeping-worker:
    <<: *atlas-backend
    command: atlas-worker housekeeping
    volumes: *atlas-repository-volumes
    expose:
      - "9094"
      - "9095"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-setup:
    <<: *atlas-backend
    image: atlas-state-tools:local
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    # Run the image-time package so schema changes require an explicit rebuild.
    command: python -m deployment
    environment:
      <<:
        [
          *atlas-control-environment,
          *duckbasin-environment,
        ]
    depends_on:
      atlas-test-postgres:
        condition: service_healthy
    restart: "no"

volumes:
  atlas-test-postgres-data:
  atlas-load-postgres-data:
  atlas-test-nats-data:
  atlas-load-nats-data:
