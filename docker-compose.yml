services:
  atlas-api:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    container_name: atlas-api
    working_dir: /app/backend
    command: fastapi dev api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      NATS_URL: nats://atlas-nats:4222
    depends_on:
      - atlas-nats

  atlas-worker:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    container_name: atlas-worker
    working_dir: /app/backend
    command: python -m domains.index.worker
    volumes:
      - .:/app
    environment:
      NATS_URL: nats://atlas-nats:4222
    depends_on:
      - atlas-nats

  atlas-nats:
    image: nats:2.11-alpine
    container_name: atlas-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    expose:
      - "4222"
      - "8222"
    volumes:
      - atlas-nats-data:/data
    restart: unless-stopped

volumes:
  atlas-nats-data:
