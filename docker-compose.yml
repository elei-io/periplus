name: periplus

x-periplus-core: &periplus-core
  build:
    context: .
    dockerfile: docker/periplus/Dockerfile
    additional_contexts:
      periplus-extension: ${PERIPLUS_DUCKDB_EXTENSION_REPO:-../periplus-duckdb-extension}
      ducklake-cdc-extension: ${PERIPLUS_DUCKLAKE_CDC_EXTENSION_REPO:-../quack/ducklake-cdc-extension-1.5.5}
  image: ${PERIPLUS_CORE_IMAGE:-periplus-core:local}
  working_dir: /app/packages/periplus

x-periplus-healthcheck: &periplus-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-lake-alluxio-environment: &lake-alluxio-environment
  ALLUXIO_JAVA_OPTS: >-
    -Dalluxio.master.hostname=lake-alluxio-master
    -Dalluxio.master.mount.table.root.ufs=s3://${LAKE_B2_BUCKET:?Set LAKE_B2_BUCKET}/${LAKE_B2_PREFIX-}
    -Dalluxio.master.journal.folder=/journal
    -Dalluxio.worker.tieredstore.level0.alias=SSD
    -Dalluxio.worker.tieredstore.level0.dirs.path=/worker
    -Dalluxio.worker.tieredstore.level0.dirs.quota=${LAKE_ALLUXIO_WORKER_CAPACITY:-4GB}
    -Dalluxio.proxy.s3.writetype=ASYNC_THROUGH
    -Dalluxio.user.file.replication.durable=1
    -Dalluxio.underfs.s3.endpoint=${LAKE_B2_ENDPOINT:?Set LAKE_B2_ENDPOINT}
    -Dalluxio.underfs.s3.endpoint.region=${LAKE_B2_REGION:?Set LAKE_B2_REGION}
    -Dalluxio.underfs.s3.region=${LAKE_B2_REGION:?Set LAKE_B2_REGION}
    -Dalluxio.underfs.s3.disable.dns.buckets=true
    -Dalluxio.underfs.s3.inherit.acl=false
    -Dalluxio.underfs.s3.secure.http.enabled=true
    -Dalluxio.underfs.s3.streaming.upload.enabled=true
    -Ds3a.accessKeyId=${LAKE_B2_KEY_ID:?Set LAKE_B2_KEY_ID}
    -Ds3a.secretKey=${LAKE_B2_APPLICATION_KEY:?Set LAKE_B2_APPLICATION_KEY}

x-lake-alluxio: &lake-alluxio
  image: ${LAKE_ALLUXIO_IMAGE:-alluxio/alluxio:2.9.5}
  # The upstream OSS image is amd64-only. Docker Desktop emulates it on Apple Silicon.
  platform: linux/amd64
  environment: *lake-alluxio-environment

x-periplus-control-environment: &periplus-control-environment
  PERIPLUS_CONTROL_DATABASE_URL: postgresql://${PERIPLUS_POSTGRES_USER:-periplus}:${PERIPLUS_POSTGRES_PASSWORD:-periplus_local}@periplus-postgres:5432/${PERIPLUS_POSTGRES_DATABASE:-periplus}

x-periplus-nats-environment: &periplus-nats-environment
  PERIPLUS_NATS_URL: nats://periplus-nats:4222
  PERIPLUS_NATS_SEED: ""

x-periplus-ducklake-environment: &periplus-ducklake-environment
  PERIPLUS_DUCKLAKE_ALIAS: periplus
  PERIPLUS_DUCKLAKE_METADATA_PATH: postgres:dbname=${LAKE_POSTGRES_DATABASE:-lake} host=lake-postgres port=5432 user=${LAKE_POSTGRES_USER:-lake} password=${LAKE_POSTGRES_PASSWORD:-lake_local}
  PERIPLUS_DUCKLAKE_METADATA_SCHEMA: ducklake
  PERIPLUS_DUCKLAKE_DATA_PATH: s3://lake/
  PERIPLUS_DUCKLAKE_S3_ENDPOINT: lake-alluxio-s3:39999/api/v1/s3
  PERIPLUS_DUCKLAKE_S3_REGION: us-east-1
  PERIPLUS_DUCKLAKE_S3_KEY_ID: ${PERIPLUS_DUCKLAKE_S3_KEY_ID:-alluxio}
  PERIPLUS_DUCKLAKE_S3_SECRET_ACCESS_KEY: ${PERIPLUS_DUCKLAKE_S3_SECRET_ACCESS_KEY:-lake-secret}
  PERIPLUS_DUCKLAKE_S3_URL_STYLE: path
  PERIPLUS_DUCKLAKE_S3_USE_SSL: "false"
  PERIPLUS_DUCKLAKE_CDC_EXTENSION_PATH: /opt/periplus/ducklake_cdc.duckdb_extension

x-periplus-repository-environment: &periplus-repository-environment
  PERIPLUS_REPOSITORY_STORAGE: s3
  PERIPLUS_REPOSITORY_S3_BUCKET: raw
  PERIPLUS_REPOSITORY_S3_ENDPOINT: ${PERIPLUS_COMPOSE_REPOSITORY_S3_ENDPOINT:-http://lake-alluxio-s3:39999/api/v1/s3}
  PERIPLUS_REPOSITORY_S3_REGION: us-east-1
  PERIPLUS_REPOSITORY_S3_KEY_ID: ${PERIPLUS_REPOSITORY_S3_KEY_ID:-alluxio}
  PERIPLUS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${PERIPLUS_REPOSITORY_S3_SECRET_ACCESS_KEY:-lake-secret}
  PERIPLUS_REPOSITORY_S3_URL_STYLE: path
  PERIPLUS_REPOSITORY_S3_USE_SSL: "false"

x-periplus-graph-environment: &periplus-graph-environment
  PERIPLUS_GRAPH_MAX_RUN_SECONDS: ${PERIPLUS_GRAPH_MAX_RUN_SECONDS:-604800}

services:
  lake-alluxio-init:
    container_name: lake-alluxio-init
    <<: *lake-alluxio
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /journal /worker
        if [[ ! -f /journal/.periplus-formatted ]]; then
          /opt/alluxio/bin/alluxio formatMaster
          touch /journal/.periplus-formatted
        fi
        if [[ ! -f /worker/.periplus-formatted ]]; then
          /opt/alluxio/bin/alluxio formatWorker
          touch /worker/.periplus-formatted
        fi
        chown -R 1000:1000 /journal /worker
    volumes:
      - lake-alluxio-journal:/journal
      - lake-alluxio-worker-data:/worker
    restart: "no"

  lake-alluxio-master:
    container_name: lake-alluxio-master
    <<: *lake-alluxio
    command: ["master", "--no-format"]
    volumes:
      - lake-alluxio-journal:/journal
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19999/api/v1/master/info"]
    depends_on:
      lake-alluxio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  lake-alluxio-namespace-init:
    container_name: lake-alluxio-namespace-init
    <<: *lake-alluxio
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for namespace in raw lake; do
          /opt/alluxio/bin/alluxio fs stat "/$${namespace}" >/dev/null 2>&1 \
            || /opt/alluxio/bin/alluxio fs mkdir "/$${namespace}"
        done
    depends_on:
      lake-alluxio-master:
        condition: service_healthy
    restart: "no"

  lake-alluxio-worker:
    container_name: lake-alluxio-worker
    <<: *lake-alluxio
    command: ["worker", "--no-format"]
    volumes:
      - lake-alluxio-worker-data:/worker
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:30000/api/v1/worker/info"]
    depends_on:
      lake-alluxio-init:
        condition: service_completed_successfully
      lake-alluxio-master:
        condition: service_healthy
      lake-alluxio-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

  lake-alluxio-s3:
    container_name: lake-alluxio-s3
    <<: *lake-alluxio
    command: ["proxy"]
    ports:
      - "127.0.0.1:${LAKE_ALLUXIO_S3_PORT:-7070}:39999"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:39999/api/v1/proxy/info"]
    depends_on:
      lake-alluxio-master:
        condition: service_healthy
      lake-alluxio-worker:
        condition: service_healthy
    restart: unless-stopped

  lake-postgres:
    container_name: lake-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LAKE_POSTGRES_DATABASE:-lake}
      POSTGRES_USER: ${LAKE_POSTGRES_USER:-lake}
      POSTGRES_PASSWORD: ${LAKE_POSTGRES_PASSWORD:-lake_local}
    ports:
      - "127.0.0.1:${LAKE_POSTGRES_PORT:-55433}:5432"
    volumes:
      - lake-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  periplus-postgres:
    container_name: periplus-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PERIPLUS_POSTGRES_DATABASE:-periplus}
      POSTGRES_USER: ${PERIPLUS_POSTGRES_USER:-periplus}
      POSTGRES_PASSWORD: ${PERIPLUS_POSTGRES_PASSWORD:-periplus_local}
    ports:
      - "127.0.0.1:${PERIPLUS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - periplus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  periplus-nats:
    container_name: periplus-nats
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${PERIPLUS_NATS_PORT:-5422}:4222"
      - "127.0.0.1:${PERIPLUS_NATS_MONITOR_PORT:-5822}:8222"
    volumes:
      - periplus-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  periplus-admin:
    container_name: periplus-admin
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    image: ${PERIPLUS_ADMIN_IMAGE:-periplus-admin:local}
    environment:
      PERIPLUS_ADMIN_API_TOKEN: ${PERIPLUS_ADMIN_API_TOKEN:?Set PERIPLUS_ADMIN_API_TOKEN}
    ports:
      - "127.0.0.1:${PERIPLUS_ADMIN_PORT:-8081}:80"
    depends_on:
      periplus-api:
        condition: service_healthy
    restart: unless-stopped

  periplus-public:
    container_name: periplus-public
    build:
      context: .
      dockerfile: docker/public/Dockerfile
    image: ${PERIPLUS_PUBLIC_IMAGE:-periplus-public:local}
    environment:
      PERIPLUS_API_URL: http://periplus-api:8000
      PERIPLUS_PUBLIC_API_TOKEN: ${PERIPLUS_PUBLIC_API_TOKEN:?Set PERIPLUS_PUBLIC_API_TOKEN}
      PERIPLUS_PUBLIC_RECEIPT_SECRET: ${PERIPLUS_PUBLIC_RECEIPT_SECRET:?Set PERIPLUS_PUBLIC_RECEIPT_SECRET}
    ports:
      - "127.0.0.1:${PERIPLUS_PUBLIC_PORT:-8080}:3000"
    depends_on:
      periplus-api:
        condition: service_healthy
    restart: unless-stopped

  periplus-api:
    container_name: periplus-api
    <<: *periplus-core
    command: fastapi run src/periplus/entrypoints/api.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${PERIPLUS_API_PORT:-8000}:8000"
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
    environment:
      PERIPLUS_ADMIN_API_TOKEN: ${PERIPLUS_ADMIN_API_TOKEN:?Set PERIPLUS_ADMIN_API_TOKEN}
      PERIPLUS_PUBLIC_API_TOKEN: ${PERIPLUS_PUBLIC_API_TOKEN:?Set PERIPLUS_PUBLIC_API_TOKEN}
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
          *periplus-graph-environment,
        ]
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-crawler:
    <<: *periplus-core
    command: periplus-worker crawler
    deploy:
      replicas: 1
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
          *periplus-graph-environment,
        ]
      PERIPLUS_CDP_URL: ${PERIPLUS_COMPOSE_CDP_URL:-http://host.docker.internal:9222}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-ingestor:
    <<: *periplus-core
    command: periplus-worker ingestor
    deploy:
      replicas: 4
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
        ]
      PERIPLUS_INGESTOR_CONCURRENCY: ${PERIPLUS_INGESTOR_CONCURRENCY:-4}
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-materializer:
    <<: *periplus-core
    command: periplus-worker materializer
    deploy:
      replicas: 4
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
        ]
      PERIPLUS_MATERIALIZER_CONCURRENCY: ${PERIPLUS_MATERIALIZER_CONCURRENCY:-2}
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-janitor:
    container_name: periplus-janitor
    <<: *periplus-core
    command: periplus-worker janitor
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-repository-environment,
          *periplus-graph-environment,
        ]
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-setup:
    container_name: periplus-setup
    <<: *periplus-core
    # Run the image-time package so schema changes require an explicit rebuild.
    command: periplus-setup
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
        ]
    depends_on:
      periplus-postgres:
        condition: service_healthy
      lake-postgres:
        condition: service_healthy
      lake-alluxio-s3:
        condition: service_healthy
    restart: "no"

volumes:
  lake-alluxio-journal:
  lake-alluxio-worker-data:
  lake-postgres-data:
  periplus-postgres-data:
  periplus-nats-data:
