name: atlas

x-atlas-backend: &atlas-backend
  build: &atlas-backend-build
    context: .
    dockerfile: docker/atlas/Dockerfile
    additional_contexts:
      atlas-extension: ../atlas-duckdb-extension
      ducklake-cdc-extension: ../quack/ducklake-cdc-extension-1.5.5
  image: atlas-backend:local
  working_dir: /app/backend

x-atlas-state-volumes: &atlas-state-volumes
  - ./.atlas:/app/.atlas

x-atlas-healthcheck: &atlas-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-atlas-control-environment: &atlas-control-environment
  DATABASE_URL: postgresql://atlas:atlas_local@atlas-test-postgres:5432/atlas_test

x-atlas-nats-environment: &atlas-nats-environment
  ATLAS_NATS_URL: nats://atlas-test-nats:4222
  ATLAS_NATS_SEED: ""

x-atlas-ducklake-environment: &atlas-ducklake-environment
  ATLAS_DUCKLAKE_ALIAS: atlas
  ATLAS_DUCKLAKE_METADATA_PATH: postgres:dbname=atlas_test host=atlas-test-postgres port=5432 user=atlas password=atlas_local
  ATLAS_DUCKLAKE_METADATA_SCHEMA: ducklake
  ATLAS_DUCKLAKE_DATA_PATH: /app/.atlas/lake/
  ATLAS_DUCKLAKE_CDC_EXTENSION_PATH: /opt/atlas/ducklake_cdc.duckdb_extension

x-atlas-repository-environment: &atlas-repository-environment
  ATLAS_REPOSITORY_STORAGE: disk
  ATLAS_REPOSITORY_ROOT: /app/.atlas/repository

x-atlas-graph-environment: &atlas-graph-environment
  ATLAS_GRAPH_MAX_RUN_SECONDS: ${ATLAS_GRAPH_MAX_RUN_SECONDS:-604800}

services:
  atlas-test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_test
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local
    ports:
      - "127.0.0.1:${ATLAS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - atlas-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-test-nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${ATLAS_NATS_PORT:-5422}:4222"
      - "127.0.0.1:${ATLAS_NATS_MONITOR_PORT:-5822}:8222"
    volumes:
      - atlas-test-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-ducklake-s3:
    image: ghcr.io/versity/versitygw:v1.4.1
    command:
      [
        "--port",
        ":7070",
        "--health",
        "/healthz",
        "--readonly",
        "posix",
        "--nometa",
        "/data",
      ]
    environment:
      ROOT_ACCESS_KEY: ${ATLAS_DUCKLAKE_S3_KEY_ID:-atlas}
      ROOT_SECRET_KEY: ${ATLAS_DUCKLAKE_S3_SECRET_ACCESS_KEY:-atlas-secret}
    ports:
      - "127.0.0.1:${ATLAS_DUCKLAKE_S3_PORT:-7070}:7070"
    volumes:
      - type: bind
        source: ./.atlas/lake
        target: /data/atlas
        read_only: true
    healthcheck:
      <<: *atlas-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7070/healthz"]
    restart: unless-stopped

  atlas-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: atlas-web:local
    ports:
      - "127.0.0.1:${ATLAS_WEB_PORT:-8080}:80"
    depends_on:
      atlas-api:
        condition: service_healthy
    restart: unless-stopped

  atlas-api:
    <<: *atlas-backend
    command: fastapi run src/atlas/entrypoints/api.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${ATLAS_API_PORT:-8000}:8000"
    volumes: *atlas-state-volumes
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATLAS_AI_MODEL: ${ATLAS_AI_MODEL:-openai:gpt-5.6-sol}
      ATLAS_AI_MODEL_TIMEOUT_SECONDS: ${ATLAS_AI_MODEL_TIMEOUT_SECONDS:-180}
      ATLAS_AI_REQUEST_LIMIT: ${ATLAS_AI_REQUEST_LIMIT:-32}
      ATLAS_AI_TOOL_CALL_LIMIT: ${ATLAS_AI_TOOL_CALL_LIMIT:-24}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-acquisition-worker:
    <<: *atlas-backend
    command: atlas-worker acquisition
    deploy:
      replicas: 1
    volumes: *atlas-state-volumes
    expose:
      - "9090"
      - "9099"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      CDP_URL: ${CDP_URL:-ws://192.168.30.201:8411/v1/connect}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-ingestion-worker:
    <<: *atlas-backend
    command: atlas-worker ingestion
    deploy:
      replicas: 1
    volumes: *atlas-state-volumes
    expose:
      - "9091"
      - "9092"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-materialization-worker:
    <<: *atlas-backend
    command: atlas-worker materialization
    deploy:
      replicas: 1
    volumes: *atlas-state-volumes
    expose:
      - "9093"
      - "9096"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
        ]
      ATLAS_MATERIALIZATION_CONCURRENCY: ${ATLAS_MATERIALIZATION_CONCURRENCY:-2}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-housekeeping-worker:
    <<: *atlas-backend
    command: atlas-worker housekeeping
    volumes: *atlas-state-volumes
    expose:
      - "9094"
      - "9095"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-test-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-setup:
    <<: *atlas-backend
    image: atlas-state-tools:local
    build: *atlas-backend-build
    # Run the image-time package so schema changes require an explicit rebuild.
    command: atlas-setup
    volumes: *atlas-state-volumes
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
        ]
    depends_on:
      atlas-test-postgres:
        condition: service_healthy
    restart: "no"

volumes:
  atlas-test-postgres-data:
  atlas-test-nats-data:
