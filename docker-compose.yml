x-atlas-backend: &atlas-backend
  build:
    context: .
    dockerfile: docker/atlas/Dockerfile
  image: atlas-backend:local
  working_dir: /app/backend

x-atlas-repository-volumes: &atlas-repository-volumes
  - ./.atlas/repository:/app/.atlas/repository

x-atlas-healthcheck: &atlas-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-atlas-control-environment: &atlas-control-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}}

x-atlas-catalogue-environment: &atlas-catalogue-environment
  ATLAS_CATALOGUE_CATALOG: ${ATLAS_CATALOGUE_CATALOG:-postgres}
  ATLAS_CATALOGUE_CATALOG_DSN: ${ATLAS_CATALOGUE_CATALOG_DSN:-host=atlas-postgres port=5432 dbname=${POSTGRES_CATALOGUE_DB:-atlas_catalogue} user=${POSTGRES_USER:-atlas} password=${POSTGRES_PASSWORD:-atlas}}

x-atlas-nats-environment: &atlas-nats-environment
  NATS_URL: ${NATS_URL:-nats://atlas-nats:4222}
  NATS_SEED: ${NATS_SEED:-}

x-atlas-repository-environment: &atlas-repository-environment
  ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
  ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
  ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:-http://atlas-minio:9000}
  ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
  ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-${MINIO_ROOT_USER:-atlas}}
  ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-atlas-secret}}
  ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
  ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-}

x-atlas-resource-environment: &atlas-resource-environment
  ATLAS_CATALOGUE_MAX_CONCURRENCY: ${ATLAS_CATALOGUE_MAX_CONCURRENCY:-64}
  ATLAS_OBJECT_IO_MAX_CONCURRENCY: ${ATLAS_OBJECT_IO_MAX_CONCURRENCY:-64}

x-atlas-quack-environment: &atlas-quack-environment
  ATLAS_QUACK_URI: quack:atlas-quack:9494
  ATLAS_QUACK_TOKEN: ${ATLAS_QUACK_TOKEN:-atlas-local-quack}
  ATLAS_QUACK_DISABLE_SSL: "true"
  ATLAS_QUACK_MAX_CONCURRENCY: ${ATLAS_QUACK_MAX_CONCURRENCY:-4}
  ATLAS_QUACK_POOL_WAIT_SECONDS: ${ATLAS_QUACK_POOL_WAIT_SECONDS:-5}
  ATLAS_QUACK_QUERY_TIMEOUT_SECONDS: ${ATLAS_QUACK_QUERY_TIMEOUT_SECONDS:-30}
  ATLAS_QUACK_QUERY_MAX_ROWS: ${ATLAS_QUACK_QUERY_MAX_ROWS:-100000}
  ATLAS_QUACK_QUERY_MAX_BYTES: ${ATLAS_QUACK_QUERY_MAX_BYTES:-67108864}
  ATLAS_QUACK_QUERY_STATE_TTL_SECONDS: ${ATLAS_QUACK_QUERY_STATE_TTL_SECONDS:-3600}
  ATLAS_QUACK_QUERY_STATE_MAX_BYTES: ${ATLAS_QUACK_QUERY_STATE_MAX_BYTES:-67108864}

services:
  atlas-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: atlas-web:local
    container_name: atlas-web
    ports:
      - "127.0.0.1:${ATLAS_WEB_PORT:-8080}:80"
    depends_on:
      atlas-api:
        condition: service_healthy
    restart: unless-stopped

  atlas-api:
    <<: *atlas-backend
    container_name: atlas-api
    command: fastapi run api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()",
        ]
    volumes: *atlas-repository-volumes
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
          *atlas-quack-environment,
        ]
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATLAS_SEARCH_MODEL: ${ATLAS_SEARCH_MODEL:-openai:gpt-5.6-luna}
      ATLAS_SEARCH_MODEL_TIMEOUT_SECONDS: ${ATLAS_SEARCH_MODEL_TIMEOUT_SECONDS:-60}
      ATLAS_SEARCH_MODEL_REQUEST_LIMIT: ${ATLAS_SEARCH_MODEL_REQUEST_LIMIT:-32}
      ATLAS_SEARCH_TOOL_CALL_LIMIT: ${ATLAS_SEARCH_TOOL_CALL_LIMIT:-24}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-quack:
        condition: service_healthy
    restart: unless-stopped

  atlas-acquisition-worker:
    <<: *atlas-backend
    command: atlas-worker acquisition
    deploy:
      replicas: 2
    volumes: *atlas-repository-volumes
    expose:
      - "9090"
      - "9099"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      CDP_URL: ${CDP_URL:-ws://192.168.30.201:8411/v1/connect}
      ATLAS_GRAPH_MAX_REQUESTS_PER_RUN: ${ATLAS_GRAPH_MAX_REQUESTS_PER_RUN:-10000}
      ATLAS_GRAPH_MAX_RUN_SECONDS: ${ATLAS_GRAPH_MAX_RUN_SECONDS:-3600}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  atlas-ingestion-worker:
    <<: *atlas-backend
    command: atlas-worker ingestion
    deploy:
      replicas: 4
    volumes: *atlas-repository-volumes
    expose:
      - "9091"
      - "9092"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-maintenance-worker:
        condition: service_healthy
    restart: unless-stopped

  atlas-materialization-worker:
    <<: *atlas-backend
    command: atlas-worker materialization
    deploy:
      replicas: 2
    volumes: *atlas-repository-volumes
    expose:
      - "9093"
      - "9096"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-catalogue-relay:
        condition: service_healthy
      atlas-maintenance-worker:
        condition: service_healthy
    restart: unless-stopped

  atlas-catalogue-relay:
    <<: *atlas-backend
    command: atlas-worker catalogue-relay
    volumes: *atlas-repository-volumes
    expose:
      - "9097"
      - "9098"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9098/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  atlas-maintenance-worker:
    <<: *atlas-backend
    command: atlas-worker maintenance
    volumes: *atlas-repository-volumes
    expose:
      - "9094"
      - "9095"
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-resource-environment,
        ]
      ATLAS_REPOSITORY_STAGING_ROOT: /app/.atlas/repository/staging
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  atlas-setup:
    <<: *atlas-backend
    image: atlas-state-tools:local
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
      args:
        ATLAS_DUCKDB_EXTENSIONS: ducklake,parquet,postgres,httpfs,sqlite
    # Run the image-time package so schema changes require an explicit rebuild.
    command: python -m deployment
    volumes: *atlas-repository-volumes
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-catalogue-environment,
          *atlas-repository-environment,
        ]
    restart: "no"

  atlas-quack:
    image: duckdb/duckdb:1.5.4
    container_name: atlas-quack
    command: ["/duckdb", "-init", "/opt/atlas/quack-init.sql"]
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:9494:9494"
    environment:
      ATLAS_QUACK_TOKEN: ${ATLAS_QUACK_TOKEN:-atlas-local-quack}
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
      test:
        [
          "CMD",
          "/duckdb",
          "-c",
          "FROM quack_query('quack:127.0.0.1:9494', 'SELECT 1', token=getenv('ATLAS_QUACK_TOKEN'));",
        ]
    volumes:
      - ./docker/quack/init.sql:/opt/atlas/quack-init.sql:ro
    restart: unless-stopped

