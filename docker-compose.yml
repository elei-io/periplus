      ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
      ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-atlas-secret}
      ATLAS_REPOSITORY_S3_SESSION_TOKEN: ${ATLAS_REPOSITORY_S3_SESSION_TOKEN:-}
      ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
      ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-false}
      ATLAS_QUACK_URL: ${ATLAS_QUACK_URL:-quack:atlas-quack:9494}
      ATLAS_QUACK_CLIENT_TOKEN: ${ATLAS_QUACK_CLIENT_TOKEN:-atlas-local-quack}
      ATLAS_QUACK_DISABLE_SSL: ${ATLAS_QUACK_DISABLE_SSL:-true}
      ATLAS_MATERIALIZATION_MAX_OUTPUT_ROWS: ${ATLAS_MATERIALIZATION_MAX_OUTPUT_ROWS:-100000}
      ATLAS_MATERIALIZATION_MAX_OUTPUT_BYTES: ${ATLAS_MATERIALIZATION_MAX_OUTPUT_BYTES:-33554432}
      ATLAS_MATERIALIZATION_BACKFILL_PAGE_SIZE: ${ATLAS_MATERIALIZATION_BACKFILL_PAGE_SIZE:-1000}
      ATLAS_MATERIALIZATION_STREAM_REPLICAS: ${ATLAS_MATERIALIZATION_STREAM_REPLICAS:-1}
      ATLAS_MATERIALIZATION_MAX_DELIVER: ${ATLAS_MATERIALIZATION_MAX_DELIVER:-5}
      ATLAS_MATERIALIZATION_WORKER_HEALTH_HOST: 0.0.0.0
      ATLAS_MATERIALIZATION_WORKER_HEALTH_PORT: 9093
      ATLAS_DUCKLAKE_CDC_VERSION: ${ATLAS_DUCKLAKE_CDC_VERSION:-ducklake_cdc 0.5.3}
      NATS_URL: nats://atlas-nats:4222
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
    depends_on:
      atlas-quack:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
      atlas-repository-worker:
        condition: service_healthy
    restart: unless-stopped

  atlas-setup:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
      args:
        ATLAS_DUCKDB_EXTENSIONS: ducklake,parquet,postgres,httpfs,sqlite
    image: atlas-state-tools:local
    working_dir: /app/backend
    command: atlas-setup
    volumes:
      - .:/app
      - ./.atlas/repository:/app/.atlas/repository
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_CATALOGUE_CATALOG: postgres
      ATLAS_CATALOGUE_CATALOG_DSN: "host=atlas-postgres port=5432 dbname=${POSTGRES_CATALOGUE_DB:-atlas_catalogue} user=${POSTGRES_USER:-atlas} password=${POSTGRES_PASSWORD:-atlas}"
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_CATALOGUE_DATA_INLINING_ROW_LIMIT: ${ATLAS_CATALOGUE_DATA_INLINING_ROW_LIMIT:-10}
      ATLAS_CATALOGUE_OVERRIDE_DATA_PATH: ${ATLAS_CATALOGUE_OVERRIDE_DATA_PATH:-true}
      ATLAS_CATALOGUE_DUCKDB_DATABASE: ${ATLAS_CATALOGUE_DUCKDB_DATABASE:-:memory:}
      ATLAS_CATALOGUE_DUCKDB_THREADS: ${ATLAS_CATALOGUE_DUCKDB_THREADS:-}
      ATLAS_CATALOGUE_DUCKDB_MEMORY_LIMIT: ${ATLAS_CATALOGUE_DUCKDB_MEMORY_LIMIT:-}
      ATLAS_CATALOGUE_DUCKDB_MAX_TEMP_SIZE: ${ATLAS_CATALOGUE_DUCKDB_MAX_TEMP_SIZE:-}
      ATLAS_CATALOGUE_DUCKDB_TEMP_DIRECTORY: ${ATLAS_CATALOGUE_DUCKDB_TEMP_DIRECTORY:-}
      ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
      ATLAS_REPOSITORY_ROOT: /app/.atlas/repository
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_PREFIX: ${ATLAS_REPOSITORY_S3_PREFIX:-}
      ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:-http://atlas-minio:9000}
      ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
      ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-atlas-secret}
      ATLAS_REPOSITORY_S3_SESSION_TOKEN: ${ATLAS_REPOSITORY_S3_SESSION_TOKEN:-}
      ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
      ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-false}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      atlas-postgres:
        condition: service_healthy
      atlas-minio-init:
        condition: service_completed_successfully
    restart: "no"

  atlas-nats:
    image: nats:2.11-alpine
    container_name: atlas-nats
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - atlas-nats-data:/data

  atlas-postgres:
    image: postgres:18
    container_name: atlas-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    restart: unless-stopped


  atlas-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: atlas-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - atlas-minio-data:/data
    restart: unless-stopped

  atlas-minio-init:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    command: python -m repository init-s3
    environment:
      ATLAS_REPOSITORY_STORAGE: s3
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_ENDPOINT: http://atlas-minio:9000
      ATLAS_REPOSITORY_S3_REGION: us-east-1
      ATLAS_REPOSITORY_S3_KEY_ID: ${MINIO_ROOT_USER:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-atlas-secret}
      ATLAS_REPOSITORY_S3_URL_STYLE: path
      ATLAS_REPOSITORY_S3_USE_SSL: "false"
    depends_on:
      atlas-minio:
        condition: service_healthy
    restart: "no"

volumes:
  atlas-postgres-data:
  atlas-nats-data:
  atlas-minio-data:
