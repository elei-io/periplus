services:
  atlas-api:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    container_name: atlas-api
    working_dir: /app/backend
    command: fastapi run api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.atlas/repository:/app/.atlas/repository
    environment:
      ATLAS_BROWSER_CONCURRENCY: ${ATLAS_BROWSER_CONCURRENCY:-1}
      ATLAS_CATALOGUE_CATALOG: postgres
      ATLAS_CATALOGUE_CATALOG_DSN: "host=atlas-postgres port=5432 dbname=${POSTGRES_CATALOGUE_DB:-atlas_catalogue} user=${POSTGRES_USER:-atlas} password=${POSTGRES_PASSWORD:-atlas}"
      ATLAS_CATALOGUE_POSTGRES_POOL_MAX_CONNECTIONS: ${ATLAS_CATALOGUE_POSTGRES_POOL_MAX_CONNECTIONS:-2}
      ATLAS_CATALOGUE_POSTGRES_POOL_IDLE_TIMEOUT_MS: ${ATLAS_CATALOGUE_POSTGRES_POOL_IDLE_TIMEOUT_MS:-5000}
      ATLAS_CATALOGUE_POSTGRES_POOL_MAX_LIFETIME_MS: ${ATLAS_CATALOGUE_POSTGRES_POOL_MAX_LIFETIME_MS:-60000}
      ATLAS_CATALOGUE_POSTGRES_POOL_WAIT_TIMEOUT_MS: ${ATLAS_CATALOGUE_POSTGRES_POOL_WAIT_TIMEOUT_MS:-10000}
      ATLAS_CATALOGUE_ALIAS: ${ATLAS_CATALOGUE_ALIAS:-atlas}
      ATLAS_CATALOGUE_SCHEMA: ${ATLAS_CATALOGUE_SCHEMA:-main}
      ATLAS_CATALOGUE_DUCKDB_DATABASE: ":memory:"
      ATLAS_CATALOGUE_READ_POOL_SIZE: ${ATLAS_CATALOGUE_READ_POOL_SIZE:-2}
      ATLAS_CATALOGUE_READ_THREADS: ${ATLAS_CATALOGUE_READ_THREADS:-2}
      ATLAS_CATALOGUE_READ_POOL_WAIT_SECONDS: ${ATLAS_CATALOGUE_READ_POOL_WAIT_SECONDS:-5}
      ATLAS_REPOSITORY_STORAGE: ${ATLAS_REPOSITORY_STORAGE:-s3}
      ATLAS_REPOSITORY_ROOT: /app/.atlas/repository
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_PREFIX: ${ATLAS_REPOSITORY_S3_PREFIX:-}
      ATLAS_REPOSITORY_S3_ENDPOINT: ${ATLAS_REPOSITORY_S3_ENDPOINT:-http://atlas-minio:9000}
      ATLAS_REPOSITORY_S3_REGION: ${ATLAS_REPOSITORY_S3_REGION:-us-east-1}
      ATLAS_REPOSITORY_S3_KEY_ID: ${ATLAS_REPOSITORY_S3_KEY_ID:-atlas}
      ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${ATLAS_REPOSITORY_S3_SECRET_ACCESS_KEY:-atlas-secret}
      ATLAS_REPOSITORY_S3_SESSION_TOKEN: ${ATLAS_REPOSITORY_S3_SESSION_TOKEN:-}
      ATLAS_REPOSITORY_S3_URL_STYLE: ${ATLAS_REPOSITORY_S3_URL_STYLE:-path}
      ATLAS_REPOSITORY_S3_USE_SSL: ${ATLAS_REPOSITORY_S3_USE_SSL:-false}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      NATS_URL: nats://atlas-nats:4222
      NATS_RETENTION: ${NATS_RETENTION:-5m}
    depends_on:
      atlas-postgres:
        condition: service_healthy
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy

  atlas-crawl-http-worker:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    working_dir: /app/backend
    command: python -m workers.crawl_http
    deploy:
      replicas: 2
    volumes:
      - ./.atlas/repository:/app/.atlas/repository
    expose:
      - "9090"
      - "9099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      ATLAS_CRAWL_HTTP_WORKER_ID: ${ATLAS_CRAWL_HTTP_WORKER_ID:-}
      ATLAS_CRAWL_HTTP_WORKER_CONCURRENCY: ${ATLAS_CRAWL_HTTP_WORKER_CONCURRENCY:-8}
      ATLAS_CRAWL_HTTP_MAX_ACK_PENDING: ${ATLAS_CRAWL_HTTP_MAX_ACK_PENDING:-1000}
      ATLAS_CRAWL_BROWSER_MAX_ACK_PENDING: ${ATLAS_CRAWL_BROWSER_MAX_ACK_PENDING:-100}
      ATLAS_CRAWL_PROVIDER_MAX_ACK_PENDING: ${ATLAS_CRAWL_PROVIDER_MAX_ACK_PENDING:-100}
      ATLAS_GRAPH_MAX_REQUESTS_PER_RUN: ${ATLAS_GRAPH_MAX_REQUESTS_PER_RUN:-10000}
      ATLAS_GRAPH_MAX_RUN_SECONDS: ${ATLAS_GRAPH_MAX_RUN_SECONDS:-3600}
