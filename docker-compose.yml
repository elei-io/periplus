    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - atlas-nats-data:/data

  atlas-postgres:
    image: postgres:18
    container_name: atlas-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    restart: unless-stopped


  atlas-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: atlas-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - atlas-minio-data:/data
    restart: unless-stopped

  atlas-minio-init:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    command: python -m repository init-s3
    environment:
      ATLAS_REPOSITORY_STORAGE: s3
      ATLAS_REPOSITORY_S3_BUCKET: ${ATLAS_REPOSITORY_S3_BUCKET:-atlas}
      ATLAS_REPOSITORY_S3_ENDPOINT: http://atlas-minio:9000
