name: periplus

x-periplus-core: &periplus-core
  build:
    context: .
    dockerfile: docker/periplus/Dockerfile
    additional_contexts:
      ducklake-cdc-extension: ${PERIPLUS_DUCKLAKE_CDC_EXTENSION_REPO:-../quack/ducklake-cdc-extension-1.5.5}
  image: ${PERIPLUS_CORE_IMAGE:-periplus-core:local}
  working_dir: /app/packages/periplus

x-periplus-healthcheck: &periplus-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-periplus-control-environment: &periplus-control-environment
  PERIPLUS_CONTROL_DATABASE_URL: postgresql://${PERIPLUS_POSTGRES_USER:-periplus}:${PERIPLUS_POSTGRES_PASSWORD:-periplus_local}@periplus-postgres:5432/${PERIPLUS_POSTGRES_DATABASE:-periplus}

x-periplus-nats-environment: &periplus-nats-environment
  PERIPLUS_NATS_URL: nats://periplus-nats:4222
  PERIPLUS_NATS_SEED: ""

x-periplus-ducklake-environment: &periplus-ducklake-environment
  PERIPLUS_DUCKLAKE_ALIAS: periplus
  PERIPLUS_DUCKLAKE_METADATA_PATH: postgres:dbname=${LAKE_POSTGRES_DATABASE:-lake} host=lake-postgres port=5432 user=${LAKE_POSTGRES_USER:-lake} password=${LAKE_POSTGRES_PASSWORD:-lake_local}
  PERIPLUS_DUCKLAKE_METADATA_SCHEMA: ducklake
  PERIPLUS_DUCKLAKE_DATA_PATH: s3://lake/
  PERIPLUS_DUCKLAKE_S3_ENDPOINT: lake-s3:7070
  PERIPLUS_DUCKLAKE_S3_REGION: us-east-1
  PERIPLUS_DUCKLAKE_S3_KEY_ID: ${LAKE_S3_KEY_ID:-periplus-local}
  PERIPLUS_DUCKLAKE_S3_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_ACCESS_KEY:-lake-secret}
  PERIPLUS_DUCKLAKE_S3_URL_STYLE: path
  PERIPLUS_DUCKLAKE_S3_USE_SSL: "false"
  PERIPLUS_DUCKLAKE_CDC_EXTENSION_PATH: /opt/periplus/ducklake_cdc.duckdb_extension

x-periplus-repository-environment: &periplus-repository-environment
  PERIPLUS_REPOSITORY_STORAGE: s3
  PERIPLUS_REPOSITORY_S3_BUCKET: raw
  PERIPLUS_REPOSITORY_S3_ENDPOINT: http://lake-s3:7070
  PERIPLUS_REPOSITORY_S3_REGION: us-east-1
  PERIPLUS_REPOSITORY_S3_KEY_ID: ${LAKE_S3_KEY_ID:-periplus-local}
  PERIPLUS_REPOSITORY_S3_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_ACCESS_KEY:-lake-secret}
  PERIPLUS_REPOSITORY_S3_URL_STYLE: path
  PERIPLUS_REPOSITORY_S3_USE_SSL: "false"

x-periplus-graph-environment: &periplus-graph-environment
  PERIPLUS_GRAPH_MAX_RUN_SECONDS: ${PERIPLUS_GRAPH_MAX_RUN_SECONDS:-604800}

services:
  lake-s3-init:
    container_name: lake-s3-init
    image: alpine:3.22
    command: ["sh", "-ec", "mkdir -p /data/raw /data/lake"]
    volumes:
      - lake-s3-data:/data
    restart: "no"

  lake-s3:
    container_name: lake-s3
    image: ${LAKE_S3_IMAGE:-versity/versitygw:v1.8.0}
    command: ["--port", ":7070", "--health", "/healthz", "--iam-dir", "/iam", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${LAKE_S3_KEY_ID:-periplus-local}
      ROOT_SECRET_KEY: ${LAKE_S3_SECRET_ACCESS_KEY:-lake-secret}
    ports:
      - "127.0.0.1:${LAKE_S3_PORT:-7070}:7070"
    volumes:
      - lake-s3-data:/data
      - lake-s3-iam:/iam
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7070/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      lake-s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  lake-postgres:
    container_name: lake-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LAKE_POSTGRES_DATABASE:-lake}
      POSTGRES_USER: ${LAKE_POSTGRES_USER:-lake}
      POSTGRES_PASSWORD: ${LAKE_POSTGRES_PASSWORD:-lake_local}
    ports:
      - "127.0.0.1:${LAKE_POSTGRES_PORT:-55433}:5432"
    volumes:
      - lake-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  periplus-postgres:
    container_name: periplus-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PERIPLUS_POSTGRES_DATABASE:-periplus}
      POSTGRES_USER: ${PERIPLUS_POSTGRES_USER:-periplus}
      POSTGRES_PASSWORD: ${PERIPLUS_POSTGRES_PASSWORD:-periplus_local}
    ports:
      - "127.0.0.1:${PERIPLUS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - periplus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  periplus-nats:
    container_name: periplus-nats
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${PERIPLUS_NATS_PORT:-5422}:4222"
      - "127.0.0.1:${PERIPLUS_NATS_MONITOR_PORT:-5822}:8222"
    volumes:
      - periplus-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  periplus-admin:
    container_name: periplus-admin
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    image: ${PERIPLUS_ADMIN_IMAGE:-periplus-admin:local}
    environment:
      PERIPLUS_ADMIN_API_TOKEN: ${PERIPLUS_ADMIN_API_TOKEN:?Set PERIPLUS_ADMIN_API_TOKEN}
      PERIPLUS_QUERY_API_TOKEN: ${PERIPLUS_QUERY_API_TOKEN:?Set PERIPLUS_QUERY_API_TOKEN}
    ports:
      - "127.0.0.1:${PERIPLUS_ADMIN_PORT:-8081}:80"
    depends_on:
      periplus-api:
        condition: service_healthy
      periplus-query:
        condition: service_healthy
    restart: unless-stopped

  query-access-init:
    <<: *periplus-core
    command: ["python", "/bootstrap/query-access.py"]
    volumes:
      - ./docker/query/bootstrap.py:/bootstrap/query-access.py:ro
    environment:
      LAKE_ADMIN_DSN: postgresql://${LAKE_POSTGRES_USER:-lake}:${LAKE_POSTGRES_PASSWORD:-lake_local}@lake-postgres:5432/${LAKE_POSTGRES_DATABASE:-lake}
      LAKE_QUERY_USER: ${LAKE_QUERY_USER:-lake_query}
      LAKE_QUERY_PASSWORD: ${LAKE_QUERY_PASSWORD:-lake_query_local}
      LAKE_S3_ENDPOINT: http://lake-s3:7070
      LAKE_S3_KEY_ID: ${LAKE_S3_KEY_ID:-periplus-local}
      LAKE_S3_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_ACCESS_KEY:-lake-secret}
      LAKE_QUERY_S3_KEY_ID: ${LAKE_QUERY_S3_KEY_ID:-periplus-query}
      LAKE_QUERY_S3_SECRET_ACCESS_KEY: ${LAKE_QUERY_S3_SECRET_ACCESS_KEY:-query-local-secret}
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
    restart: "no"

  periplus-query:
    <<: *periplus-core
    command: fastapi run src/periplus/entrypoints/query.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${PERIPLUS_QUERY_PORT:-8010}:8000"
    environment:
      PERIPLUS_QUERY_API_TOKEN: ${PERIPLUS_QUERY_API_TOKEN:?Set PERIPLUS_QUERY_API_TOKEN}
      PERIPLUS_DUCKLAKE_ALIAS: periplus
      PERIPLUS_DUCKLAKE_METADATA_PATH: postgres:dbname=${LAKE_POSTGRES_DATABASE:-lake} host=lake-postgres port=5432 user=${LAKE_QUERY_USER:-lake_query} password=${LAKE_QUERY_PASSWORD:-lake_query_local}
      PERIPLUS_DUCKLAKE_METADATA_SCHEMA: ducklake
      PERIPLUS_DUCKLAKE_DATA_PATH: s3://lake/
      PERIPLUS_DUCKLAKE_S3_ENDPOINT: lake-s3:7070
      PERIPLUS_DUCKLAKE_S3_REGION: us-east-1
      PERIPLUS_DUCKLAKE_S3_KEY_ID: ${LAKE_QUERY_S3_KEY_ID:-periplus-query}
      PERIPLUS_DUCKLAKE_S3_SECRET_ACCESS_KEY: ${LAKE_QUERY_S3_SECRET_ACCESS_KEY:-query-local-secret}
      PERIPLUS_DUCKLAKE_S3_URL_STYLE: path
      PERIPLUS_DUCKLAKE_S3_USE_SSL: "false"
    mem_limit: 1g
    cpus: 2
    healthcheck:
      <<: *periplus-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
    depends_on:
      query-access-init:
        condition: service_completed_successfully
    restart: unless-stopped


  periplus-public:
    container_name: periplus-public
    build:
      context: .
      dockerfile: docker/public/Dockerfile
    image: ${PERIPLUS_PUBLIC_IMAGE:-periplus-public:local}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PERIPLUS_AI_MODEL: ${PERIPLUS_AI_MODEL:-}
      PERIPLUS_QUERY_URL: http://periplus-query:8000
      PERIPLUS_API_URL: http://periplus-api:8000
      PERIPLUS_PUBLIC_API_TOKEN: ${PERIPLUS_PUBLIC_API_TOKEN:?Set PERIPLUS_PUBLIC_API_TOKEN}
      PERIPLUS_QUERY_API_TOKEN: ${PERIPLUS_QUERY_API_TOKEN:?Set PERIPLUS_QUERY_API_TOKEN}
    ports:
      - "127.0.0.1:${PERIPLUS_PUBLIC_PORT:-8080}:3000"
    depends_on:
      periplus-query:
        condition: service_healthy
    restart: unless-stopped

  periplus-api:
    container_name: periplus-api
    <<: *periplus-core
    command: fastapi run src/periplus/entrypoints/api.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${PERIPLUS_API_PORT:-8000}:8000"
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
    environment:
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PERIPLUS_COVERAGE_MODEL: ${PERIPLUS_COVERAGE_MODEL:-}
      PERIPLUS_ADMIN_API_TOKEN: ${PERIPLUS_ADMIN_API_TOKEN:?Set PERIPLUS_ADMIN_API_TOKEN}
      PERIPLUS_PUBLIC_API_TOKEN: ${PERIPLUS_PUBLIC_API_TOKEN:?Set PERIPLUS_PUBLIC_API_TOKEN}
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
          *periplus-graph-environment,
        ]
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-crawler:
    <<: *periplus-core
    command: periplus-worker crawler
    deploy:
      replicas: 1
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
          *periplus-graph-environment,
        ]
      PERIPLUS_CDP_URL: ${PERIPLUS_COMPOSE_CDP_URL:-http://host.docker.internal:9222}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-ingestor:
    <<: *periplus-core
    command: periplus-worker ingestor
    deploy:
      replicas: 4
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
        ]
      PERIPLUS_INGESTOR_CONCURRENCY: ${PERIPLUS_INGESTOR_CONCURRENCY:-4}
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-materializer:
    <<: *periplus-core
    command: periplus-worker materializer
    deploy:
      replicas: 4
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
        ]
      PERIPLUS_MATERIALIZER_CONCURRENCY: ${PERIPLUS_MATERIALIZER_CONCURRENCY:-2}
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-janitor:
    container_name: periplus-janitor
    <<: *periplus-core
    command: periplus-worker janitor
    healthcheck:
      <<: *periplus-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-nats-environment,
          *periplus-repository-environment,
          *periplus-graph-environment,
        ]
    depends_on:
      periplus-setup:
        condition: service_completed_successfully
      periplus-nats:
        condition: service_healthy
    restart: unless-stopped

  periplus-setup:
    container_name: periplus-setup
    <<: *periplus-core
    # Run the image-time package so schema changes require an explicit rebuild.
    command: periplus-setup
    environment:
      <<:
        [
          *periplus-control-environment,
          *periplus-ducklake-environment,
          *periplus-repository-environment,
        ]
    depends_on:
      periplus-postgres:
        condition: service_healthy
      lake-postgres:
        condition: service_healthy
      lake-s3:
        condition: service_healthy
    restart: "no"

volumes:
  lake-s3-data:
  lake-s3-iam:
  lake-postgres-data:
  periplus-postgres-data:
  periplus-nats-data:
