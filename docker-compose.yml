name: atlas

x-atlas-backend: &atlas-backend
  build:
    context: .
    dockerfile: docker/atlas/Dockerfile
    additional_contexts:
      atlas-extension: ${ATLAS_DUCKDB_EXTENSION_REPO:-../atlas-duckdb-extension}
      ducklake-cdc-extension: ${ATLAS_DUCKLAKE_CDC_EXTENSION_REPO:-../quack/ducklake-cdc-extension-1.5.5}
  image: ${ATLAS_BACKEND_IMAGE:-atlas-backend:local}
  working_dir: /app/backend

x-atlas-state-volumes: &atlas-state-volumes
  - atlas-repository-data:/app/.atlas/repository

x-atlas-healthcheck: &atlas-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-atlas-control-environment: &atlas-control-environment
  ATLAS_CONTROL_DATABASE_URL: postgresql://${ATLAS_POSTGRES_USER:-atlas}:${ATLAS_POSTGRES_PASSWORD:-atlas_local}@atlas-postgres:5432/${ATLAS_POSTGRES_DATABASE:-atlas}

x-atlas-nats-environment: &atlas-nats-environment
  ATLAS_NATS_URL: nats://atlas-nats:4222
  ATLAS_NATS_SEED: ""

x-atlas-ducklake-environment: &atlas-ducklake-environment
  ATLAS_DUCKLAKE_ALIAS: atlas
  ATLAS_DUCKLAKE_METADATA_PATH: postgres:dbname=${LAKE_POSTGRES_DATABASE:-lake} host=lake-postgres port=5432 user=${LAKE_POSTGRES_USER:-lake} password=${LAKE_POSTGRES_PASSWORD:-lake_local}
  ATLAS_DUCKLAKE_METADATA_SCHEMA: ducklake
  ATLAS_DUCKLAKE_DATA_PATH: s3://lake/
  ATLAS_DUCKLAKE_S3_ENDPOINT: lake-s3:7070
  ATLAS_DUCKLAKE_S3_REGION: us-east-1
  ATLAS_DUCKLAKE_S3_KEY_ID: ${ATLAS_DUCKLAKE_S3_KEY_ID:-lake}
  ATLAS_DUCKLAKE_S3_SECRET_ACCESS_KEY: ${ATLAS_DUCKLAKE_S3_SECRET_ACCESS_KEY:-lake-secret}
  ATLAS_DUCKLAKE_S3_URL_STYLE: path
  ATLAS_DUCKLAKE_S3_USE_SSL: "false"
  ATLAS_DUCKLAKE_CDC_EXTENSION_PATH: /opt/atlas/ducklake_cdc.duckdb_extension

x-atlas-repository-environment: &atlas-repository-environment
  ATLAS_REPOSITORY_STORAGE: disk
  ATLAS_REPOSITORY_ROOT: /app/.atlas/repository

x-atlas-graph-environment: &atlas-graph-environment
  ATLAS_GRAPH_MAX_RUN_SECONDS: ${ATLAS_GRAPH_MAX_RUN_SECONDS:-604800}

services:
  lake-s3:
    container_name: lake-s3
    image: ghcr.io/versity/versitygw:v1.4.1
    command:
      [
        "--port",
        ":7070",
        "--health",
        "/healthz",
        "posix",
        "--sidecar",
        "/metadata",
        "/data",
      ]
    environment:
      ROOT_ACCESS_KEY: ${LAKE_S3_ROOT_ACCESS_KEY:-lake}
      ROOT_SECRET_KEY: ${LAKE_S3_ROOT_SECRET_ACCESS_KEY:-lake-secret}
    ports:
      - "127.0.0.1:${LAKE_S3_PORT:-7070}:7070"
    volumes:
      - lake-s3-data:/data/lake
      - lake-s3-metadata:/metadata
    healthcheck:
      <<: *atlas-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7070/healthz"]
    restart: unless-stopped

  lake-postgres:
    container_name: lake-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LAKE_POSTGRES_DATABASE:-lake}
      POSTGRES_USER: ${LAKE_POSTGRES_USER:-lake}
      POSTGRES_PASSWORD: ${LAKE_POSTGRES_PASSWORD:-lake_local}
    ports:
      - "127.0.0.1:${LAKE_POSTGRES_PORT:-55433}:5432"
    volumes:
      - lake-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-postgres:
    container_name: atlas-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ATLAS_POSTGRES_DATABASE:-atlas}
      POSTGRES_USER: ${ATLAS_POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:-atlas_local}
    ports:
      - "127.0.0.1:${ATLAS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-nats:
    container_name: atlas-nats
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${ATLAS_NATS_PORT:-5422}:4222"
      - "127.0.0.1:${ATLAS_NATS_MONITOR_PORT:-5822}:8222"
    volumes:
      - atlas-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  atlas-web:
    container_name: atlas-web
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: ${ATLAS_WEB_IMAGE:-atlas-web:local}
    ports:
      - "127.0.0.1:${ATLAS_WEB_PORT:-8080}:80"
    depends_on:
      atlas-api:
        condition: service_healthy
    restart: unless-stopped

  atlas-api:
    container_name: atlas-api
    <<: *atlas-backend
    command: fastapi run src/atlas/entrypoints/api.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${ATLAS_API_PORT:-8000}:8000"
    volumes: *atlas-state-volumes
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATLAS_AI_MODEL: ${ATLAS_AI_MODEL:-openai:gpt-5.6-sol}
      ATLAS_AI_MODEL_TIMEOUT_SECONDS: ${ATLAS_AI_MODEL_TIMEOUT_SECONDS:-180}
      ATLAS_AI_REQUEST_LIMIT: ${ATLAS_AI_REQUEST_LIMIT:-32}
      ATLAS_AI_TOOL_CALL_LIMIT: ${ATLAS_AI_TOOL_CALL_LIMIT:-24}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-crawler:
    <<: *atlas-backend
    command: atlas-worker crawler
    deploy:
      replicas: 1
    volumes: *atlas-state-volumes
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
      ATLAS_CDP_URL: ${ATLAS_COMPOSE_CDP_URL:-http://host.docker.internal:9222}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-ingestor:
    <<: *atlas-backend
    command: atlas-worker ingestor
    deploy:
      replicas: 4
    volumes: *atlas-state-volumes
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
        ]
      ATLAS_INGESTOR_CONCURRENCY: ${ATLAS_INGESTOR_CONCURRENCY:-4}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-materializer:
    <<: *atlas-backend
    command: atlas-worker materializer
    deploy:
      replicas: 4
    volumes: *atlas-state-volumes
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9096/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
        ]
      ATLAS_MATERIALIZER_CONCURRENCY: ${ATLAS_MATERIALIZER_CONCURRENCY:-2}
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-janitor:
    container_name: atlas-janitor
    <<: *atlas-backend
    command: atlas-worker janitor
    volumes: *atlas-state-volumes
    healthcheck:
      <<: *atlas-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=2).read()",
        ]
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-nats-environment,
          *atlas-repository-environment,
          *atlas-graph-environment,
        ]
    depends_on:
      atlas-setup:
        condition: service_completed_successfully
      atlas-nats:
        condition: service_healthy
    restart: unless-stopped

  atlas-setup:
    container_name: atlas-setup
    <<: *atlas-backend
    # Run the image-time package so schema changes require an explicit rebuild.
    command: atlas-setup
    volumes: *atlas-state-volumes
    environment:
      <<:
        [
          *atlas-control-environment,
          *atlas-ducklake-environment,
          *atlas-repository-environment,
        ]
    depends_on:
      atlas-postgres:
        condition: service_healthy
      lake-postgres:
        condition: service_healthy
      lake-s3:
        condition: service_healthy
    restart: "no"

volumes:
  lake-s3-data:
  lake-s3-metadata:
  lake-postgres-data:
  atlas-postgres-data:
  atlas-nats-data:
  atlas-repository-data:
