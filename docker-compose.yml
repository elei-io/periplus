services:
  atlas-api:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
    image: atlas-backend:local
    container_name: atlas-api
    working_dir: /app/backend
    command: fastapi dev api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./.artifacts:/app/.artifacts
    environment:
      ARTIFACTS_ROOT: /app/.artifacts
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
    depends_on:
      atlas-postgres:
        condition: service_healthy

  atlas-postgres:
    image: postgres:18
    container_name: atlas-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  atlas-postgres-data:
