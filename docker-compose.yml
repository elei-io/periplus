      ATLAS_NAVIGATION_OBJECT_RETENTION_DAYS: ${ATLAS_NAVIGATION_OBJECT_RETENTION_DAYS:-2}
    depends_on:
      atlas-minio:
        condition: service_healthy
    restart: "no"

