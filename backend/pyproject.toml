[project]
name = "atlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18",
    "crawl4ai>=0.9.0",
    "fastapi[standard]>=0.139.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "typer>=0.26.8",
]

[project.scripts]
atlas = "cli.app:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "actions",
    "actions.extract",
    "actions.index",
    "actions.scrape",
    "actions.search",
    "actions.shared",
    "actions.shared.extract_schema",
    "actions.shared.quality",
    "artifacts",
    "api",
    "api.routers",
    "cli",
    "cli.apps",
    "db",
    "tasks",
]
