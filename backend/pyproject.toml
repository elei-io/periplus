[project]
name = "atlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18",
    "crawl4ai>=0.9.0",
    "croniter>=6.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28",
    "nats-py>=2.11",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "typer>=0.26.8",
]

[project.scripts]
atlas = "cli.app:app"
atlas-worker = "worker.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "actions",
    "actions.extract",
    "actions.index",
    "actions.crawl",
    "actions.search",
    "actions.shared",
    "actions.shared.data_schema",
    "actions.shared.query_schema",
    "actions.shared.quality",
    "artifacts",
    "crawl_policies",
    "crawls",
    "data_schemas",
    "query_schemas",
    "api",
    "api.routers",
    "cli",
    "cli.apps",
    "db",
    "tasks",
    "urls",
    "worker",
]
