[project]
name = "atlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "crawl4ai>=0.9.0",
    "fastapi[standard]>=0.139.0",
    "typer>=0.26.8",
]

[project.scripts]
atlas = "cli.app:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "api",
    "api.routers",
    "cli",
    "cli.apps",
    "domains",
    "domains.index",
    "domains.search",
]
