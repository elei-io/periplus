[project]
name = "atlas"
version = "0.1.0"
description = "Web acquisition and normalization for SQL-centric data pipelines"
readme = { text = "Atlas backend services and command-line tools.", content-type = "text/markdown" }
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18",
    "crawl4ai>=0.9.0",
    "croniter>=6.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28",
    "nats-py>=2.11",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.22",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.0",
    "typer>=0.26.8",
    "ducklake-client>=0.8.1",
    "boto3>=1.42",
    "zstandard>=0.25",
    "html5lib>=1.1",
    "pyarrow>=21",
    "sqlglot>=27",
]

[project.scripts]
atlas = "cli.app:app"
atlas-worker = "worker.app:main"
atlas-ingestor = "repository.worker:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
